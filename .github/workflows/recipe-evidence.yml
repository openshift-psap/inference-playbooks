name: Recipe evidence

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contributor-bundles:
    # Native per-architecture proof: the GitHub-hosted ARM64 runner builds,
    # scans, and runs the image without AMD64 emulation.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            machine: x86_64
            runs-on: ubuntu-latest
          - arch: arm64
            machine: aarch64
            runs-on: ubuntu-24.04-arm
    name: contributor-bundles (${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test portable bundle, import, and runner contracts on native ${{ matrix.arch }}
        run: |
          python3 -m pip install -r tools/requirements.txt pytest==8.3.4
          python3 -m pytest tests/test_contributor.py tests/test_contributor_monitor.py tests/test_runner_image_security.py tests/test_runner_image_platform.py tests/test_runner_release.py tests/test_contributor_smoke_wiring.py tests/test_maintain_contributor.py -q
      - name: Build pinned Forge runner for linux/${{ matrix.arch }} (never publish from PR CI)
        run: |
          docker build -f benchmarks/runner/Containerfile -t localhost/contributor-runner:ci .
          test "$(docker image inspect --format '{{.Architecture}}' localhost/contributor-runner:ci)" = "${{ matrix.arch }}"
      - name: Freeze the exact built image used for import smokes
        run: |
          image_id=$(docker image inspect --format '{{.Id}}' localhost/contributor-runner:ci)
          test "$(docker image inspect --format '{{.Architecture}}' "$image_id")" = "${{ matrix.arch }}"
          printf 'IMAGE_ID=%s\n' "$image_id" >> "$GITHUB_ENV"
      - name: Gate built runner on secret scanning (never upload matches)
        env:
          CONTAINER_ENGINE: docker
        run: python3 tools/scan_runner_image.py localhost/contributor-runner:ci
      - name: Verify the bundled OpenShift CLI runs in this architecture
        run: |
          test "$(docker run --rm --entrypoint uname localhost/contributor-runner:ci -m)" = "${{ matrix.machine }}"
          docker run --rm --entrypoint oc localhost/contributor-runner:ci version --client
      - name: Import container-produced evidence for both smoke harnesses
        env:
          CONTAINER_ENGINE: docker
        run: |
          for workload in guidellm-smoke aiperf-smoke; do
            python3 tests/contributor_import_smoke.py \
              --engine docker --image "$IMAGE_ID" \
              --arch ${{ matrix.arch }} --workload "$workload"
          done
      - name: Exercise Forge failure finalizers in the built image
        run: |
          docker run --rm --network none --entrypoint python \
            -v "$PWD/tests/contributor_guidellm_cleanup_smoke.py:/cleanup-smoke.py:ro" \
            localhost/contributor-runner:ci /cleanup-smoke.py

  contributor-bundles-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Confirm native Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Test native runner contracts and portable import
        run: |
          python -m pip install -r tools/requirements.txt pytest==8.3.4
          python -m pytest tests/test_contributor.py -q
      - name: Bootstrap pinned Forge and oc; run synthetic harness and cleanup flows
        run: python tests/contributor_macos_smoke.py

  hardware-profiles:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.comparison.outputs.base }}
      head: ${{ steps.comparison.outputs.head }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: comparison
        name: Resolve comparison against the tested merge parent
        run: python3 tools/ci_baseline.py
      - name: Validate profiles, recipes, and raw-manifest conversion
        env:
          BASE: ${{ steps.comparison.outputs.base }}
          HEAD: ${{ steps.comparison.outputs.head }}
        run: >-
          python3 -m pip install --disable-pip-version-check -r tools/requirements.txt &&
          python3 tools/validate.py
          --require-converted-raw
          --base "$BASE"
          --head "$HEAD"

  affected-recipes:
    needs: hardware-profiles
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.affected.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: affected
        name: Find recipes affected by this change
        env:
          BASE: ${{ needs.hardware-profiles.outputs.base }}
          HEAD: ${{ needs.hardware-profiles.outputs.head }}
        run: |
          python3 -m pip install --disable-pip-version-check -r tools/requirements.txt
          matrix=$(python3 tools/recipe_evidence.py \
            --base "$BASE" \
            --head "$HEAD" affected-recipes)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  manifest-drift:
    needs: affected-recipes
    if: ${{ fromJSON(needs.affected-recipes.outputs.matrix).recipes[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.affected-recipes.outputs.matrix).recipes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install rendering dependencies
        run: python3 -m pip install --disable-pip-version-check -r tools/requirements.txt
      - name: Install Kustomize
        run: |
          curl --fail --location --silent --show-error https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/kustomize.tar.gz"
          echo "54e4031ddc4e7fc59e408da29e7c646e8e57b8088c51b84b3df0864f47b5148f  $RUNNER_TEMP/kustomize.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/kustomize.tar.gz" -C "$RUNNER_TEMP" kustomize
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Render and check manifest drift
        env:
          RECIPE: ${{ matrix.recipe }}
        run: python3 tools/check_manifests.py "$RECIPE"
