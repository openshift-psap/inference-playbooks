name: Catalog site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Staging catalog]
    branches: [staging/all-pr-manifests]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('catalog-pr-{0}', github.event.pull_request.number) || (github.ref == 'refs/heads/staging/all-pr-manifests' && 'catalog-staging-build' || 'catalog-main-build') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: >-
      ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    outputs:
      production_sha: ${{ steps.source.outputs.commit }}
      staging_sha: ${{ steps.staging.outputs.sha }}
    steps:
      - id: source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned build and test dependencies
        run: python3 -m pip install -r tools/requirements.txt -r tools/requirements-dev.txt
      - name: Install Kustomize
        run: |
          curl --fail --location --silent --show-error https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/kustomize.tar.gz"
          echo "54e4031ddc4e7fc59e408da29e7c646e8e57b8088c51b84b3df0864f47b5148f  $RUNNER_TEMP/kustomize.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/kustomize.tar.gz" -C "$RUNNER_TEMP" kustomize
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install Chromium test browser
        run: python3 -m playwright install --with-deps chromium
      - name: Build exact checkout bundle
        run: python3 tools/build-site.py --require-clean --source-sha "$GITHUB_SHA"
      - name: Contract, source, security, and browser tests
        run: python3 -m pytest tests -q
      - name: Verify no tracked source drift
        run: git diff --exit-code
      - name: Upload unprivileged PR preview
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-preview-${{ github.event.pull_request.number }}
          path: .build/site
          retention-days: 14
          if-no-files-found: error
      - name: Resolve exact staging revision
        id: staging
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/staging/all-pr-manifests" --jq .object.sha)" >> "$GITHUB_OUTPUT"
      - name: Checkout staging without credentials
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.staging.outputs.sha }}
          path: .build/staging-source
          fetch-depth: 0
          persist-credentials: false
      - name: Build staging and assemble both sites
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          STAGING_SHA: ${{ steps.staging.outputs.sha }}
        run: |
          python3 .build/staging-source/tools/build-site.py --repo .build/staging-source --out .build/staging-source/.build/site --require-clean --source-sha "$STAGING_SHA"
          python3 tools/assemble_pages.py --production .build/site --staging .build/staging-source/.build/site --out .build/pages
      - name: Upload same-run combined Pages artifact
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .build/pages

  deploy:
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: catalog-production
      cancel-in-progress: false
    steps:
      - name: Refuse stale main publication
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_SHA: ${{ needs.build.outputs.production_sha }}
          STAGING_SHA: ${{ needs.build.outputs.staging_sha }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$PRODUCTION_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/staging/all-pr-manifests" --jq .object.sha)" = "$STAGING_SHA"
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
