name: Catalog site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('catalog-pr-{0}', github.event.pull_request.number) || 'catalog-main-build' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned build and test dependencies
        run: python3 -m pip install -r tools/requirements.txt -r tools/requirements-dev.txt
      - name: Install Kustomize
        run: |
          curl --fail --location --silent --show-error https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/kustomize.tar.gz"
          echo "54e4031ddc4e7fc59e408da29e7c646e8e57b8088c51b84b3df0864f47b5148f  $RUNNER_TEMP/kustomize.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/kustomize.tar.gz" -C "$RUNNER_TEMP" kustomize
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install Chromium test browser
        run: python3 -m playwright install --with-deps chromium
      - name: Build exact checkout bundle
        run: python3 tools/build-site.py --require-clean --source-sha "$GITHUB_SHA"
      - name: Contract, source, security, and browser tests
        run: python3 -m pytest tests -q
      - name: Verify no tracked source drift
        run: git diff --exit-code
      - name: Upload unprivileged PR preview
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-preview-${{ github.event.pull_request.number }}
          path: .build/site
          retention-days: 14
          if-no-files-found: error
      - name: Upload same-run main Pages artifact
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .build/site

  deploy:
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: catalog-production
      cancel-in-progress: false
    steps:
      - name: Refuse stale main publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
