name: Import Forge benchmark evidence
on:
  push:
    branches: [main]
    paths: ['models/**', 'hardware-profiles/**']
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged recipe PR number to backfill
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: forge-evidence-ingest
  cancel-in-progress: false

jobs:
  ingest:
    if: ${{ github.ref == 'refs/heads/main' }}
    # Configure this protected environment and a runner with MLflow network access.
    environment: forge-evidence
    runs-on: ${{ fromJSON(vars.FORGE_INGEST_RUNNER || '["ubuntu-latest"]') }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Select isolated evidence workspace
        run: echo "WORK=$RUNNER_TEMP/forge-post-merge-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Checkout trusted workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: trusted
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install trusted dependencies
        run: pip install -r trusted/tools/requirements.txt
      - name: Install Kustomize
        run: |
          curl --fail --location --silent --show-error https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/kustomize.tar.gz"
          echo "54e4031ddc4e7fc59e408da29e7c646e8e57b8088c51b84b3df0864f47b5148f  $RUNNER_TEMP/kustomize.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/kustomize.tar.gz" -C "$RUNNER_TEMP" kustomize
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Prepare append-only evidence candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: automation/forge-evidence-${{ github.sha }}-${{ inputs.pr_number || 'push' }}
        run: |
          python3 trusted/tools/post_merge_evidence.py prepare \
            --repository "$REPOSITORY" \
            --branch "$BRANCH" \
            --main-sha "$(git -C trusted rev-parse HEAD)" \
            --output "$WORK"
      - name: Fetch and normalize attributed evidence
        working-directory: ${{ steps.candidate.outputs.candidate }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
          MLFLOW_WORKSPACE: ${{ vars.MLFLOW_WORKSPACE || 'forge-sandbox' }}
          MLFLOW_USERNAME: ${{ secrets.MLFLOW_USERNAME }}
          MLFLOW_PASSWORD: ${{ secrets.MLFLOW_PASSWORD }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
          INSECURE_TLS: ${{ vars.MLFLOW_INSECURE_TLS }}
        run: |
          args=()
          if [[ -n "$PR_NUMBER" ]]; then args+=(--pr-number "$PR_NUMBER"); else args+=(--before "$BEFORE" --head "$HEAD"); fi
          if [[ "$INSECURE_TLS" == "true" ]]; then args+=(--insecure); fi
          python3 "$GITHUB_WORKSPACE/trusted/tools/ingest_forge.py" --repo "$PWD" "${args[@]}"
      - name: Stage trusted validation snapshot
        working-directory: ${{ steps.candidate.outputs.candidate }}
        env:
          TRUSTED: ${{ github.workspace }}/trusted
        run: |
          python3 "$TRUSTED/tools/post_merge_evidence.py" stage \
            --candidate "$PWD" \
            --trusted "$TRUSTED" \
            --snapshot "$WORK/validation"
      - name: Validate evidence
        working-directory: ${{ env.WORK }}/validation
        run: python3 "$GITHUB_WORKSPACE/trusted/tools/validate.py" --repo "$PWD" --current
      - name: Check catalog integration
        working-directory: ${{ env.WORK }}/validation
        run: python3 "$GITHUB_WORKSPACE/trusted/tools/build-site.py" --repo "$PWD"
      - name: Mint repository-scoped evidence App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FORGE_INGEST_APP_CLIENT_ID }}
          private-key: ${{ secrets.FORGE_INGEST_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Publish append-only evidence update
        id: evidence-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python3 trusted/tools/post_merge_evidence.py publish \
            --plan "$WORK/plan.json"
      - name: Verify every evidence PR commit has a GitHub-verified signature
        if: ${{ steps.evidence-pr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.evidence-pr.outputs.pull-request-number }}
        run: >-
          python3 trusted/tools/verify_pr_signatures.py
          --repository "$REPOSITORY" --pr-number "$PR_NUMBER"
