name: Import Forge benchmark evidence
on:
  push:
    branches: [main]
    paths: ['models/**', 'hardware-profiles/**']
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged recipe PR number to backfill
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: forge-evidence-ingest
  cancel-in-progress: false

jobs:
  ingest:
    if: ${{ github.ref == 'refs/heads/main' }}
    # Configure this protected environment and a runner with MLflow network access.
    environment: forge-evidence
    runs-on: ${{ fromJSON(vars.FORGE_INGEST_RUNNER || '["ubuntu-latest"]') }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt
      - name: Fetch and normalize attributed evidence
        env:
          GH_TOKEN: ${{ secrets.FORGE_INGEST_GITHUB_TOKEN || github.token }}
          MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
          MLFLOW_WORKSPACE: ${{ vars.MLFLOW_WORKSPACE || 'forge-sandbox' }}
          MLFLOW_USERNAME: ${{ secrets.MLFLOW_USERNAME }}
          MLFLOW_PASSWORD: ${{ secrets.MLFLOW_PASSWORD }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
          INSECURE_TLS: ${{ vars.MLFLOW_INSECURE_TLS }}
        run: |
          args=()
          if [[ -n "$PR_NUMBER" ]]; then args+=(--pr-number "$PR_NUMBER"); else args+=(--before "$BEFORE" --head "$HEAD"); fi
          if [[ "$INSECURE_TLS" == "true" ]]; then args+=(--insecure); fi
          python3 tools/ingest_forge.py "${args[@]}"
      - name: Validate evidence
        run: python3 tools/validate.py --current
      - name: Install Kustomize
        run: |
          curl --fail --location --silent --show-error https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/kustomize.tar.gz"
          echo "54e4031ddc4e7fc59e408da29e7c646e8e57b8088c51b84b3df0864f47b5148f  $RUNNER_TEMP/kustomize.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/kustomize.tar.gz" -C "$RUNNER_TEMP" kustomize
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check catalog integration
        run: python3 tools/build-site.py
      - name: Open evidence import PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.FORGE_INGEST_GITHUB_TOKEN || github.token }}
          branch: automation/forge-evidence-${{ github.sha }}-${{ inputs.pr_number || 'push' }}
          title: 'Import attributed Forge benchmark evidence'
          commit-message: 'feat(evidence): import attributed Forge benchmark results'
          body: |
            Automated Forge KPI intake. Raw artifacts and SHA-256 checksums are included.
            Attribution was checked against the tested PR head and merged deployment inputs.
            This import does not promote recipe maturity or platform verification.
          add-paths: |
            models/**/recipes/**/results/**
            models/**/recipes/**/recipe.yaml
