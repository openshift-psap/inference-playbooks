name: Model coverage

on:
  push:
    # Trigger configuration cannot read the event context, so this list stays
    # literal. A fork that renames its default branch must update this line;
    # the runtime write guard still derives the actual default branch below.
    branches: [main]
  pull_request:
    paths:
      - .github/ISSUE_TEMPLATE/model-coverage.yml
      - .github/workflows/model-coverage.yml
      - tools/model_coverage.py
      - tools/model_coverage_sync.py
      - tests/test_model_coverage.py
      - docs/model-tracker.md
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled, transferred]
  workflow_dispatch:
  schedule:
    # Reconciliation also catches evidence merged without a tracker edit.
    - cron: "23 5 * * *"

permissions:
  contents: read

# One group for every event: pushes, issue edits, manual runs and the schedule
# must not write the project or post comments in parallel.
concurrency:
  group: model-coverage
  cancel-in-progress: false

jobs:
  check:
    name: Evaluate tracker (read-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      reconciliation_failure: ${{ steps.record_failure.outputs.reconciliation_failure }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned validation and test dependencies
        run: python3 -m pip install -r tools/requirements.txt -r tools/requirements-dev.txt
      - name: Validate repository schemas and recipes
        id: validate
        run: python3 tools/validate.py --current
      - name: Run local-equivalent tracker tests
        run: python3 -m pytest tests/test_model_coverage.py -q
      - name: Evaluate tracking issues without write credentials
        id: evaluate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p .build/model-coverage
          gh api --paginate --slurp \
            "repos/$REPOSITORY/issues?state=all&per_page=100" \
            > .build/model-coverage/issue-pages.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          pages = json.loads(Path(".build/model-coverage/issue-pages.json").read_text())
          issues = [issue for page in pages for issue in page if "pull_request" not in issue]
          Path(".build/model-coverage/issues.json").write_text(json.dumps(issues))
          PY
          # Invalid issue definitions are reported and turned into Error/Stale
          # project states by the sync job instead of blocking every other
          # valid model update. A catalog failure still exits 2.
          python3 tools/model_coverage.py \
            --issues .build/model-coverage/issues.json --allow-errors \
            --format json --out .build/model-coverage/report.json
          python3 tools/model_coverage.py \
            --issues .build/model-coverage/issues.json --allow-errors \
            --format markdown --out .build/model-coverage/report.md
          cat .build/model-coverage/report.md
      - name: Record validation or catalog failure for stale reconciliation
        if: always() && (steps.validate.outcome == 'failure' || steps.evaluate.outcome == 'failure')
        id: record_failure
        run: echo "reconciliation_failure=true" >> "$GITHUB_OUTPUT"
      - name: Upload read-only coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: model-coverage-${{ github.run_id }}
          path: .build/model-coverage
          retention-days: 14
          if-no-files-found: warn

  sync:
    name: Sync Projects dashboard (trusted default branch only)
    needs: check
    # Pull requests never reach this job. Live writes also require an explicit
    # repository variable opt-in and a short-lived App installation token from
    # the protected forge-evidence environment.
    if: >-
      vars.MODEL_TRACKER_WRITE_ENABLED == 'true' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      github.event_name == 'issues' ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    runs-on: ubuntu-latest
    # Environment-scoped App credentials only; the job's GITHUB_TOKEN remains
    # read-only and is never used for project or comment writes.
    environment: forge-evidence
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned validation dependencies
        run: python3 -m pip install -r tools/requirements.txt
      - name: Mint tracker App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FORGE_INGEST_APP_CLIENT_ID }}
          private-key: ${{ secrets.FORGE_INGEST_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-organization-projects: write
          permission-issues: write
          permission-contents: read
      - name: Resolve tracker comment identity
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          CONFIGURED_LOGIN: ${{ vars.MODEL_TRACKER_BOT_LOGIN }}
        run: |
          if [ -n "$APP_SLUG" ]; then
            echo "MODEL_TRACKER_BOT_LOGIN=${APP_SLUG}[bot]" >> "$GITHUB_ENV"
          elif [ -n "$CONFIGURED_LOGIN" ]; then
            echo "MODEL_TRACKER_BOT_LOGIN=$CONFIGURED_LOGIN" >> "$GITHUB_ENV"
          fi
      - name: Apply idempotent project and comment sync
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MODEL_TRACKER_WRITE_ENABLED: 'true'
          MODEL_TRACKER_PROJECT_OWNER: ${{ vars.MODEL_TRACKER_PROJECT_OWNER }}
          MODEL_TRACKER_PROJECT_NUMBER: ${{ vars.MODEL_TRACKER_PROJECT_NUMBER }}
          MODEL_TRACKER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          mkdir -p .build/model-coverage
          python3 tools/model_coverage_sync.py \
            --apply \
            --plan-out .build/model-coverage/plan.json \
            --report-out .build/model-coverage/synced-report.json \
            --result-out .build/model-coverage/result.json
      - name: Upload sync plan, report, and result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: model-coverage-sync-${{ github.run_id }}
          path: .build/model-coverage
          retention-days: 14
          if-no-files-found: warn

  stale:
    name: Mark tracker items stale after a failed evaluation
    needs: check
    # Narrow failure path: only validation or evaluator failure, not a test
    # failure, marks existing tracker-owned project items stale.
    if: >-
      always() &&
      needs.check.outputs.reconciliation_failure == 'true' &&
      vars.MODEL_TRACKER_WRITE_ENABLED == 'true' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      github.event_name == 'issues' ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    runs-on: ubuntu-latest
    # Same protected App credentials as sync; the job's GITHUB_TOKEN stays
    # read-only and is never used for project writes.
    environment: forge-evidence
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned validation dependencies
        run: python3 -m pip install -r tools/requirements.txt
      - name: Mint tracker App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FORGE_INGEST_APP_CLIENT_ID }}
          private-key: ${{ secrets.FORGE_INGEST_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-organization-projects: write
          permission-issues: write
          permission-contents: read
      - name: Mark existing owned items stale
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MODEL_TRACKER_WRITE_ENABLED: 'true'
          MODEL_TRACKER_PROJECT_OWNER: ${{ vars.MODEL_TRACKER_PROJECT_OWNER }}
          MODEL_TRACKER_PROJECT_NUMBER: ${{ vars.MODEL_TRACKER_PROJECT_NUMBER }}
          MODEL_TRACKER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          mkdir -p .build/model-coverage
          python3 tools/model_coverage_sync.py \
            --apply --mark-stale \
            --stale-reason "validation or catalog evaluation failed in workflow run ${{ github.run_id }}" \
            --plan-out .build/model-coverage/stale-plan.json \
            --result-out .build/model-coverage/stale-result.json
      - name: Upload stale reconciliation audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: model-coverage-stale-${{ github.run_id }}
          path: .build/model-coverage
          retention-days: 14
          if-no-files-found: warn
