name: Runner release

# Trusted main only. PR CI builds and scans candidates but never publishes.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Publish a nightly instead of a stable release candidate'
        type: boolean
        default: false
      version:
        description: 'Release version, for example v0.2.0'
        required: false
        type: string
      confirm:
        description: 'Type publish to confirm GHCR writes'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: runner-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  RUNNER_REPOSITORY: ghcr.io/openshift-psap/inference-playbooks-runner

jobs:
  guard:
    name: Select trusted main publication
    if: github.repository == 'openshift-psap/inference-playbooks' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.select.outputs.version }}
      nightly: ${{ steps.select.outputs.nightly }}
    steps:
      - name: Check confirmation and release version
        id: select
        env:
          VERSION: ${{ inputs.version }}
          CONFIRM: ${{ inputs.confirm }}
          EVENT: ${{ github.event_name }}
          NIGHTLY: ${{ inputs.nightly }}
        run: |
          if [ "$EVENT" != schedule ] && [ "$CONFIRM" != publish ]; then
            echo 'Refusing publication: confirm must be exactly "publish".' >&2
            exit 1
          fi
          if [ "$EVENT" = schedule ] || [ "$NIGHTLY" = true ]; then
            VERSION="nightly-$(date -u +%Y%m%d)-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo 'nightly=true' >> "$GITHUB_OUTPUT"
          elif ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo 'Refusing publication: version must look like v0.2.0.' >&2
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

  publish-platform:
    name: Build, scan, and publish linux/${{ matrix.arch }}
    needs: guard
    if: github.repository == 'openshift-psap/inference-playbooks' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify runner contracts before publishing
        run: |
          python3 -m pip install -r tools/requirements.txt pytest==8.3.4
          python3 -m pytest tests/test_contributor.py tests/test_contributor_monitor.py \
            tests/test_runner_image_security.py tests/test_runner_image_platform.py \
            tests/test_contributor_smoke_wiring.py tests/test_runner_release.py \
            tests/test_maintain_contributor.py -q
      - name: Build the native linux/${{ matrix.arch }} runner
        run: |
          # No provenance or SBOM attestations: the pushed platform manifest
          # must be exactly one image manifest whose config we can verify.
          docker build --provenance=false --sbom=false \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -f benchmarks/runner/Containerfile \
            -t "localhost/contributor-runner:release-${{ matrix.arch }}" .
          test "$(docker image inspect --format '{{.Architecture}}' \
            localhost/contributor-runner:release-${{ matrix.arch }})" = "${{ matrix.arch }}"
      - name: Freeze the exact image that will be scanned and published
        run: |
          image_id=$(docker image inspect --format '{{.Id}}' \
            "localhost/contributor-runner:release-${{ matrix.arch }}")
          test "$(docker image inspect --format '{{.Architecture}}' "$image_id")" \
            = "${{ matrix.arch }}"
          forge_revision=$(docker image inspect --format \
            '{{index .Config.Labels "dev.inference-playbooks.forge-revision"}}' "$image_id")
          printf 'IMAGE_ID=%s\n' "$image_id" >> "$GITHUB_ENV"
          printf 'FORGE_REVISION=%s\n' "$forge_revision" >> "$GITHUB_ENV"
      - name: Gate the frozen image on secret scanning
        env:
          CONTAINER_ENGINE: docker
        run: |
          python3 tools/scan_runner_image.py "$IMAGE_ID" \
            --identity-output "$RUNNER_TEMP/scanned-config-digest"
      - name: Record the exported config digest of the scanned image
        run: |
          config_digest=$(cat "$RUNNER_TEMP/scanned-config-digest")
          printf '%s' "$config_digest" | grep -Eq '^sha256:[a-f0-9]{64}$'
          printf 'CONFIG_DIGEST=%s\n' "$config_digest" >> "$GITHUB_ENV"
      - name: Prove the frozen image runs and imports evidence natively
        env:
          CONTAINER_ENGINE: docker
        run: |
          for workload in guidellm-smoke aiperf-smoke; do
            python3 tests/contributor_import_smoke.py --engine docker \
              --image "$IMAGE_ID" \
              --arch "${{ matrix.arch }}" --workload "$workload"
          done
      - name: Exercise Forge failure finalizers in the frozen image
        run: |
          docker run --rm --network none --entrypoint python \
            -v "$PWD/tests/contributor_guidellm_cleanup_smoke.py:/cleanup-smoke.py:ro" \
            "$IMAGE_ID" /cleanup-smoke.py
      - name: Re-check the frozen identity immediately before publication
        run: |
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE_ID")" = "$IMAGE_ID"
      - name: Log in to the container registry with the workflow token
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login "$REGISTRY" \
            --username "${{ github.actor }}" --password-stdin
      - name: Refuse to overwrite an existing immutable platform tag
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          python3 tools/runner_release.py guard-tag \
            --reference "$RUNNER_REPOSITORY:$VERSION-${{ matrix.arch }}" --engine docker
      - name: Publish exactly the scanned image as a platform tag
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          reference="$RUNNER_REPOSITORY:$VERSION-${{ matrix.arch }}"
          docker tag "$IMAGE_ID" "$reference"
          docker push "$reference"
          docker buildx imagetools inspect "$reference" --raw \
            > "$RUNNER_TEMP/published-${{ matrix.arch }}.json"
      - name: Verify the published manifest references the scanned image config
        run: |
          mkdir -p "platform-${{ matrix.arch }}"
          python3 tools/runner_release.py verify-published \
            --manifest "$RUNNER_TEMP/published-${{ matrix.arch }}.json" \
            --config-digest "$CONFIG_DIGEST" \
            --executed-image-id "$IMAGE_ID" --arch "${{ matrix.arch }}" \
            --forge-revision "$FORGE_REVISION" \
            --output "platform-${{ matrix.arch }}/digests.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-${{ matrix.arch }}-${{ github.run_attempt }}
          path: platform-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 30

  assemble-index:
    name: Assemble and verify the published index
    needs: [guard, publish-platform]
    if: github.repository == 'openshift-psap/inference-playbooks' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install release tooling dependencies
        run: python3 -m pip install -r tools/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: platform-*-${{ github.run_attempt }}
          path: platforms
          merge-multiple: false
      - name: Normalize this attempt's platform artifact paths
        run: |
          for arch in amd64 arm64; do
            mv "platforms/platform-$arch-$GITHUB_RUN_ATTEMPT" "platforms/platform-$arch"
          done
      - name: Refuse stale nightly publication
        if: needs.guard.outputs.nightly == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current" = "$GITHUB_SHA" || {
            echo 'Main advanced; dispatch a fresh nightly run instead of promoting stale code.' >&2
            exit 1
          }
      - name: Log in to the container registry with the workflow token
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login "$REGISTRY" \
            --username "${{ github.actor }}" --password-stdin
      - name: Publish the index from the verified child manifests and record the candidate
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          NIGHTLY: ${{ needs.guard.outputs.nightly }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          channel_args=()
          if [ "$NIGHTLY" = true ]; then channel_args+=(--nightly); fi
          python3 tools/runner_release.py assemble \
            --repository "$RUNNER_REPOSITORY" \
            --version "$VERSION" \
            --platforms platforms \
            --source-revision "$SOURCE_REVISION" \
            --engine docker \
            --output dist "${channel_args[@]}"
      - name: Record that the default release was not changed
        env:
          NIGHTLY: ${{ needs.guard.outputs.nightly }}
        run: |
          git diff --exit-code -- benchmarks/runner/release.json
          {
            echo '### Runner release candidate'
            echo
            echo '`benchmarks/runner/release.json` was not modified and no default changed.'
            if [ "$NIGHTLY" = true ]; then
              echo 'Nightly alias verified. Opt in with the immutable image below; never install this as stable metadata.'
            else
              echo 'Review this stable candidate and commit it through a reviewed PR.'
            fi
            echo
            echo '```json'
            cat dist/release.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: runner-release-candidate-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  report:
    name: Publication result
    needs: [guard, publish-platform, assemble-index]
    if: always() && github.repository == 'openshift-psap/inference-playbooks' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Summarize publication status
        env:
          GUARD: ${{ needs.guard.result }}
          PLATFORMS: ${{ needs.publish-platform.result }}
          INDEX: ${{ needs.assemble-index.result }}
        run: |
          printf '### Runner publication\n\nSelection: %s\n\nPlatform gates: %s\n\nIndex/promotion: %s\n' \
            "$GUARD" "$PLATFORMS" "$INDEX" >> "$GITHUB_STEP_SUMMARY"
          test "$GUARD" = success && test "$PLATFORMS" = success && test "$INDEX" = success
