repos:
  - repo: local
    hooks:
      - id: hardware-profiles
        name: validate schemas and hardware-profile corrections
        entry: python3 tools/validate.py --base HEAD --cached
        language: python
        additional_dependencies:
          - PyYAML==6.0.2
          - jsonschema==4.25.1
        pass_filenames: false
      - id: catalog-check
        name: check catalog.json is not stale
        entry: python3 tools/catalog.py --check
        language: python
        additional_dependencies:
          - PyYAML==6.0.2
          - jsonschema==4.25.1
        pass_filenames: false
        files: ^(models/|hardware-profiles/|tools/catalog\.py|catalog/).*
