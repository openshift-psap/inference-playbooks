repos:
  - repo: local
    hooks:
      - id: contributor-bundles
        name: test portable contributor evidence and maintainer import
        entry: python3 -m pytest tests/test_contributor.py tests/test_contributor_monitor.py tests/test_runner_image_security.py tests/test_runner_image_platform.py tests/test_runner_release.py tests/test_contributor_smoke_wiring.py tests/test_maintain_contributor.py -q
        language: python
        additional_dependencies:
          - pytest==8.3.4
          - PyYAML==6.0.2
          - jsonschema==4.25.1
          - Jinja2==3.1.6
        pass_filenames: false
        files: ^(tools/|tests/(test_(contributor(_monitor)?|contributor_smoke_wiring|runner_image_security|runner_image_platform|runner_release|maintain_contributor)\.py|contributor_(import_smoke|container_smoke|fixtures|guidellm_cleanup_smoke|macos_smoke|macos_podman_smoke)\.py)$|schema/|benchmarks/runner/|\.dockerignore$|\.github/workflows/(recipe-evidence|runner-release)\.yml$)
      - id: hardware-profiles
        name: validate schemas and hardware-profile corrections
        entry: python3 tools/validate.py --base HEAD --cached
        language: python
        additional_dependencies:
          - PyYAML==6.0.2
          - jsonschema==4.25.1
          - Jinja2==3.1.6
        pass_filenames: false
      - id: catalog-check
        name: build v4 catalog contract preview
        entry: python3 tools/catalog.py
        language: python
        additional_dependencies:
          - PyYAML==6.0.2
          - jsonschema==4.25.1
          - Jinja2==3.1.6
        pass_filenames: false
        files: ^(models/|hardware-profiles/|tools/|schema/|engine-versions/).*
      - id: manifest-drift
        name: check generated manifest drift
        entry: python3 tools/check_manifests.py --base HEAD --cached
        language: python
        additional_dependencies:
          - PyYAML==6.0.2
          - jsonschema==4.25.1
          - Jinja2==3.1.6
        pass_filenames: false
