repos:
  - repo: local
    hooks:
      - id: contributor-bundles
        name: test portable contributor evidence and maintainer import
        entry: python3 -m pytest tests/test_contributor.py tests/test_runner_image_security.py -q
        language: python
        additional_dependencies:
          - pytest==8.3.4
          - PyYAML==6.0.2
          - jsonschema==4.25.1
          - Jinja2==3.1.6
        pass_filenames: false
        files: ^(tools/|tests/test_(contributor|runner_image_security)\.py$|schema/|benchmarks/runner/|\.dockerignore$|\.github/workflows/recipe-evidence\.yml$)
      - id: hardware-profiles
        name: validate schemas and hardware-profile corrections
        entry: python3 tools/validate.py --base HEAD --cached
        language: python
        additional_dependencies:
          - PyYAML==6.0.2
          - jsonschema==4.25.1
          - Jinja2==3.1.6
        pass_filenames: false
      - id: catalog-check
        name: build v4 catalog contract preview
        entry: python3 tools/catalog.py
        language: python
        additional_dependencies:
          - PyYAML==6.0.2
          - jsonschema==4.25.1
          - Jinja2==3.1.6
        pass_filenames: false
        files: ^(models/|hardware-profiles/|tools/|schema/|engine-versions/).*
      - id: manifest-drift
        name: check generated manifest drift
        entry: python3 tools/check_manifests.py --base HEAD --cached
        language: python
        additional_dependencies:
          - PyYAML==6.0.2
          - jsonschema==4.25.1
          - Jinja2==3.1.6
        pass_filenames: false
