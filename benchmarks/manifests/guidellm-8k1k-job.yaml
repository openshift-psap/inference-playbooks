apiVersion: batch/v1
kind: Job
metadata:
  name: guidellm-8k1k
  labels:
    app.kubernetes.io/name: guidellm
    app.kubernetes.io/component: benchmark
    app.kubernetes.io/part-of: inference-playbooks
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guidellm
        app.kubernetes.io/component: benchmark
    spec:
      restartPolicy: Never
      containers:
        - name: guidellm
          image: ghcr.io/vllm-project/guidellm:v0.7.3
          imagePullPolicy: IfNotPresent
          env:
            # Set to an OpenAI-compatible Service reachable from this Job's namespace.
            - name: ENDPOINT
              value: http://REPLACE_ME:8000
            # Set to the model identifier accepted by the target endpoint.
            - name: MODEL
              value: REPLACE_ME
          command:
            - guidellm
            - run
            - --backend
            - kind=openai_http,target=$(ENDPOINT),model=$(MODEL)
            - --data
            - kind=synthetic_text,prompt_tokens=8000,output_tokens=1000
            - --profile
            - '{"kind":"concurrent","streams":[1,4,16,32,64,128]}'
            - --constraint
            - kind=max_duration,seconds=300
            - --output
            - kind=json,path=/results/guidellm-8k1k.json
            - --output
            - kind=csv,path=/results/guidellm-8k1k.csv
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: results
              mountPath: /results
      volumes:
        # Replace with a PersistentVolumeClaim to retain results after Job TTL cleanup.
        - name: results
          emptyDir: {}
