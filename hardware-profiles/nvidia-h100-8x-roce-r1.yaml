accelerators:
  vendor: nvidia
  model: H100
  count_per_node: 8
  memory_per_gpu_gib: 80
network:
  inter_node_transport: roce
  rdma: true
  accelerator_nic_allocation: Eight RoCE rails per node, mlx5_1 through mlx5_8.
