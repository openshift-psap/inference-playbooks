kind: hardware-profile
description: Eight NVIDIA H200 GPUs in one node with NVLink connectivity.
accelerator_key: nvidia-h200-x8

accelerators:
  vendor: nvidia
  model: H200
  form_factor: SXM
  count_per_node: 8
  memory_per_gpu_gib: 141
  intra_node_interconnect: nvlink

host:
  cpu_architecture: x86_64
  memory_min_gib: 512

network:
  required: true
  rdma: true
  notes: Requires the rdma/ib device-plugin resource, /dev/infiniband, GDRCopy and a site-provided RDMA discovery ConfigMap. Transport and bandwidth are not established; do not infer InfiniBand versus RoCE from a resource name.

