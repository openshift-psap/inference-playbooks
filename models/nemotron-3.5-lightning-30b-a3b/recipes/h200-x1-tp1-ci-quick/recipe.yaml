      required: true
      why: Pin the tested quantized checkpoint to its exact Hugging Face revision.
    - flag: --max-model-len
      value: '16384'
      required: true
      why: Bound this initial configuration while allowing the nominal 8k/1k profile.
    - flag: --max-num-seqs
      value: '16'
      required: true
      why: Bound concurrency for the initial single-GPU smoke configuration.
    - flag: --gpu-memory-utilization
      value: '0.85'
      required: true
      why: Leave GPU-memory headroom for this unoptimized smoke configuration.
    - flag: --enforce-eager
      required: true
      why: Avoid CUDA-graph capture during the initial workflow smoke test.
    - flag: --mamba-backend
      value: flashinfer
      required: true
      why: Follow the checkpoint model card's recommended Mamba backend.
deployment:
  scope: single-node
