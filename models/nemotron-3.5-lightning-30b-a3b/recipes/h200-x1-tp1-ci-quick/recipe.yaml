  parallelism:
    mode: tp
    tp: 1
  resources:
    requests:
      cpu: '8'
      memory: 64Gi
    limits:
      cpu: '8'
      memory: 128Gi
  port: 8000
  env:
    - {name: HOME, value: /tmp}
    - {name: HF_HOME, value: /home/nobody/.cache/huggingface}
    - {name: XDG_CACHE_HOME, value: /home/nobody/.cache}
    - {name: VLLM_CACHE_ROOT, value: /home/nobody/.cache/vllm}
