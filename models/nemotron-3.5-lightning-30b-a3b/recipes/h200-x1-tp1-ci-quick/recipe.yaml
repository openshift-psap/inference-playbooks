  image_usage:
    kind: default
    variant: cuda
    note: Upstream vLLM v0.31.0 CUDA image, resolved to an immutable digest.
  engine:
    name: vllm
    version: 0.31.0
    image: docker.io/vllm/vllm-openai@sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3
    source: https://github.com/vllm-project/vllm/releases/tag/v0.31.0
  config_overrides: true
