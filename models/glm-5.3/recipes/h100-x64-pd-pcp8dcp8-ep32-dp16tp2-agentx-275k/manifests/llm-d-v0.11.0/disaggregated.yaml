apiVersion: v1
data:
  10-release-weight-page-cache.py: |
    # Loading: --release-weight-page-cache (vllm#58625, head d8596bb).
    #
    # After load_weights returns, each worker calls
    # posix_fadvise(POSIX_FADV_DONTNEED) on the checkpoint files it read, so the
    # clean checkpoint pages (~700 GiB per node for GLM-5.3) leave the page cache
    # instead of holding the node at its free-memory floor. At that floor a page
    # fault holds mmap_lock through direct reclaim, which blocks the 16 KiB
    # frame-stack mmap/munmap CPython 3.12 does in every MoE layer, and a DEP32
    # group dies when one rank stalls long enough for DeepEP's 100 s timeout.
    # Opt-in upstream; turned on with the flag in both vllm serve commands.
    #
    # Ported as text replacements of the PR's diff. The one difference: the
    # default loader imports release_checkpoint_page_cache at its call site, not
    # in the module's import block, whose contents vary between vLLM builds.

    from pathlib import Path
    import vllm

    root = Path(vllm.__file__).parent


    def patch(rel, old, new, insert_before=False):
        p = root / rel
        s = p.read_text()
        new = new + old if insert_before else old + new
        if s.count(new) == 1:
            print(f"{rel}: already applied; skipping")
            return
        assert s.count(old) == 1, (rel, s.count(old))
        p.write_text(s.replace(old, new))
        print(f"{rel}: applied")


    patch(
        "config/load.py",
        '    pt_load_map_location: str | dict[str, str] = "cpu"\n',
        "    release_weight_page_cache: bool = False\n"
        '    """Drop the checkpoint files from the OS page cache once this worker has\n'
        "    loaded its weights (`posix_fadvise(POSIX_FADV_DONTNEED)` on every file).\n"
        "    The pages are clean and are not read again after loading, so releasing\n"
        "    them returns the checkpoint's size in host memory to the node; the cost is\n"
        "    a cold re-read of the files on the next start. Only local files are\n"
        '    affected. Off by default."""\n',
        insert_before=True,
    )

    patch(
        "engine/arg_utils.py",
        "    pt_load_map_location: str | dict[str, str] = LoadConfig.pt_load_map_location\n",
        "    release_weight_page_cache: bool = LoadConfig.release_weight_page_cache\n",
        insert_before=True,
    )
    patch(
        "engine/arg_utils.py",
        "        load_group.add_argument(\n"
        '            "--pt-load-map-location", **load_kwargs["pt_load_map_location"]\n',
        "        load_group.add_argument(\n"
        '            "--release-weight-page-cache",\n'
        '            **load_kwargs["release_weight_page_cache"],\n'
        "        )\n",
        insert_before=True,
    )
    patch(
        "engine/arg_utils.py",
        "            pt_load_map_location=self.pt_load_map_location,\n        )\n",
        "            release_weight_page_cache=self.release_weight_page_cache,\n",
        insert_before=True,
    )

    patch(
        "model_executor/model_loader/default_loader.py",
        "        self.local_expert_ids: set[int] | None = None\n",
        "        # Checkpoint files handed to the weight iterators, for the optional\n"
        "        # page cache release after loading.\n"
        "        self._weight_files: list[str] = []\n",
    )
    patch(
        "model_executor/model_loader/default_loader.py",
        '        if self.load_config.load_format == "npcache":\n'
        "            # Currently np_cache only support *.bin checkpoints\n",
        "        self._weight_files.extend(hf_weights_files)\n",
        insert_before=True,
    )
    patch(
        "model_executor/model_loader/default_loader.py",
        '            "Loading weights took %.2f seconds",\n'
        "            self.counter_after_loading_weights - self.counter_before_loading_weights,\n"
        "        )\n",
        "        if self.load_config.release_weight_page_cache:\n"
        "            from vllm.model_executor.model_loader.weight_utils import (\n"
        "                release_checkpoint_page_cache,\n"
        "            )\n"
        "\n"
        "            release_checkpoint_page_cache(self._weight_files)\n",
    )

    patch(
        "model_executor/model_loader/weight_utils.py",
        "def _prefetch_all_checkpoints(\n",
        "def release_checkpoint_page_cache(files: list[str]) -> None:\n"
        '    """Advise the kernel to drop the given files from the OS page cache.\n'
        "\n"
        "    `POSIX_FADV_DONTNEED` frees clean, unmapped pages immediately and leaves\n"
        "    dirty or mapped pages alone, so calling it while another process is still\n"
        "    reading one of the files is safe: that reader re-reads from disk. Files\n"
        "    that cannot be opened are skipped. No-op on platforms without\n"
        "    `posix_fadvise`.\n"
        '    """\n'
        '    fadvise = getattr(os, "posix_fadvise", None)\n'
        '    dontneed = getattr(os, "POSIX_FADV_DONTNEED", None)\n'
        "    if fadvise is None or dontneed is None:\n"
        "        return\n"
        "    start = time.perf_counter()\n"
        "    released = 0\n"
        "    for path in files:\n"
        "        try:\n"
        "            fd = os.open(path, os.O_RDONLY)\n"
        "        except OSError as e:\n"
        '            logger.debug("Skipping page cache release for %s: %s", path, e)\n'
        "            continue\n"
        "        try:\n"
        "            fadvise(fd, 0, 0, dontneed)\n"
        "            released += 1\n"
        "        except OSError as e:\n"
        '            logger.debug("posix_fadvise(DONTNEED) failed for %s: %s", path, e)\n'
        "        finally:\n"
        "            os.close(fd)\n"
        "    logger.info(\n"
        '        "Released %d of %d checkpoint files from the page cache in %.2f seconds",\n'
        "        released,\n"
        "        len(files),\n"
        "        time.perf_counter() - start,\n"
        "    )\n"
        "\n"
        "\n",
        insert_before=True,
    )
kind: ConfigMap
metadata:
  name: vllm-startup-patches
  namespace: glm52-canary
---
apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: glm53-e2e-pcp
  namespace: glm52-canary
spec:
  roles:
  - name: prefill
    spec:
      leaderWorkerTemplate:
        restartPolicy: RecreateGroupOnPodRestart
        size: 4
        workerTemplate:
          metadata:
            annotations:
              k8s.v1.cni.cncf.io/networks: |-
                [
                  {"name":"deepep-ll-port-1"},
                  {"name":"deepep-ll-port-2"},
                  {"name":"deepep-ll-port-3"},
                  {"name":"deepep-ll-port-4"},
                  {"name":"deepep-ll-port-5"},
                  {"name":"deepep-ll-port-6"},
                  {"name":"deepep-ll-port-7"},
                  {"name":"deepep-ll-port-8"}
                ]
              llm-d.ai/active-ports: "8000"
            labels:
              llm-d.ai/guide: glm53-pcp-canary
              llm-d.ai/key: glm53-pcp-prefill-dp4pcp8
              llm-d.ai/model: GLM-5.3
              llm-d.ai/role: prefill
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                  - matchExpressions:
                    - key: nvidia.com/gpu.product
                      operator: In
                      values:
                      - NVIDIA-H100-80GB-HBM3
                    - key: rits.node-model-cache-enabled
                      operator: In
                      values:
                      - ""
                    - key: llm-d.ai/glm53-cache
                      operator: In
                      values:
                      - ready
            containers:
            - args:
              - |-
                set -euo pipefail

                find /dev/shm -type f -delete

                # One rank per pod, so no multi-port external LB / supervisor:
                # --data-parallel-rank puts each pod in external-LB mode with its
                # own API server on 8000.
                START_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))
                DP_RANK=${START_RANK}

                # Publish this rank's KV cache events over ZMQ for the EPP's
                # precise-prefix-cache-producer (replaces the approx producer).
                # Same scheme as glm53-production: vLLM adds the global DP rank
                # to the endpoint port, so subtract this pod's start rank. With
                # DP_SIZE_LOCAL=1 every pod binds one stream on 5557, the EPP's
                # socketPort. The topic identifies this pod's rank-0 API server
                # for pod discovery.
                KV_EVENTS_BASE=$(( 5557 - START_RANK ))
                KV_EVENTS_CONFIG=$(printf '%s' \
                  '{"enable_kv_cache_events":true,"publisher":"zmq",' \
                  '"endpoint":"tcp://*:'"${KV_EVENTS_BASE}"'",' \
                  '"topic":"kv@'"${POD_IP}"':8000@zai-org/GLM-5.3",' \
                  '"buffer_steps":10000,"hwm":100000,"max_queue_size":100000}')
                echo "kv-events-config: ${KV_EVENTS_CONFIG} (binds tcp://*:5557 after the +${START_RANK} DP-rank offset)"

                # CPU KV offload tier, as in ../deployment-pcp-offloading: the
                # NixlConnector kv_producer wrapped in a MultiConnector next to
                # an OffloadingConnector (TieringOffloadingSpec), giving the rank
                # a host-RAM second level behind its GPU prefix cache. One DP
                # rank per pod (DP_SIZE_LOCAL=1), so the pod maps exactly one
                # region of CPU_OFFLOAD_GIB_PER_RANK into /dev/shm.
                CPU_OFFLOAD_BYTES=$(( ${CPU_OFFLOAD_GIB_PER_RANK:-512} * 1024 * 1024 * 1024 ))
                KV_TRANSFER_CONFIG=$(printf '%s' \
                  '{"kv_connector":"MultiConnector","kv_role":"kv_both",' \
                  '"kv_load_failure_policy":"fail",' \
                  '"kv_connector_extra_config":{"connectors":[' \
                  '{"kv_connector":"NixlConnector","kv_role":"kv_producer",' \
                  '"kv_load_failure_policy":"fail"},' \
                  '{"kv_connector":"OffloadingConnector","kv_role":"kv_both",' \
                  '"kv_connector_extra_config":{"spec_name":"TieringOffloadingSpec",' \
                  '"cpu_bytes_to_use":'"${CPU_OFFLOAD_BYTES}"'}}' \
                  ']}}')
                echo "kv-transfer-config: ${KV_TRANSFER_CONFIG}"

                # Startup patches to the installed vLLM, from the vllm-startup-patches
                # ConfigMap (patches/*.py, see kustomization.yaml), applied in name
                # order. Each stops the container if its target code is missing, so
                # vLLM never serves unpatched; see the header of each file.
                for VLLM_PATCH in /vllm-patches/*.py; do
                  echo "vllm startup patch: $(basename "$VLLM_PATCH")"
                  python3 "$VLLM_PATCH"
                done

                exec vllm serve /model-cache/models/zai-org/GLM-5.3 \
                  --release-weight-page-cache \
                  --served-model-name zai-org/GLM-5.3 \
                  --port 8000 \
                  --trust-remote-code \
                  --max-model-len 275000 \
                  --kv-cache-dtype fp8 \
                  --block-size "${KV_BLOCK_SIZE}" \
                  --speculative-config '{"method":"mtp","num_speculative_tokens":1}' \
                  --reasoning-parser glm45 \
                  --tool-call-parser glm47 \
                  --enable-auto-tool-choice \
                  --enable-scale-out \
                  --disable-access-log-for-endpoints=/health,/metrics,/v1/chat/completions/render,/v1/messages/render \
                  --enable-expert-parallel \
                  --tensor-parallel-size 1 \
                  --prefill-context-parallel-size "${PCP_SIZE}" \
                  --decode-context-parallel-size "${DCP_SIZE}" \
                  --dcp-comm-backend ag_rs \
                  --attention-config '{"sparse_mla_force_mqa":true}' \
                  --data-parallel-size $(( LWS_GROUP_SIZE * DP_SIZE_LOCAL )) \
                  --data-parallel-size-local "${DP_SIZE_LOCAL}" \
                  --data-parallel-rank "${DP_RANK}" \
                  --data-parallel-address "${LWS_LEADER_ADDRESS}" \
                  --data-parallel-rpc-port 5555 \
                  --moe-backend deep_gemm \
                  --all2all-backend deepep_high_throughput \
                  --safetensors-load-strategy lazy \
                  --no-enable-flashinfer-autotune \
                  --max-num-batched-tokens "${MAX_NUM_BATCHED_TOKENS}" \
                  --long-prefill-token-threshold "${LONG_PREFILL_TOKEN_THRESHOLD}" \
                  --max-num-seqs "${MAX_NUM_SEQS}" \
                  --kv-transfer-config "${KV_TRANSFER_CONFIG}" \
                  --kv-events-config "${KV_EVENTS_CONFIG}" \
                  --kv-cache-metrics \
                  --kv-cache-metrics-sample 0.01 \
                  --compilation-config '{"cudagraph_mode":"NONE"}' \
                  --gpu-memory-utilization 0.9 \
                  --enforce-eager
              command:
              - /bin/bash
              - -c
              env:
              - name: DP_SIZE_LOCAL
                value: "1"
              - name: CPU_OFFLOAD_GIB_PER_RANK
                value: "512"
              - name: PCP_SIZE
                value: "8"
              - name: DCP_SIZE
                value: "8"
              - name: KV_BLOCK_SIZE
                value: "64"
              - name: MAX_NUM_BATCHED_TOKENS
                value: "8192"
              - name: LONG_PREFILL_TOKEN_THRESHOLD
                value: "2048"
              - name: MAX_NUM_SEQS
                value: "4"
              - name: POD_IP
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              - name: HF_HOME
                value: /model-cache
              - name: PYTHONHASHSEED
                value: "0"
              - name: OMP_NUM_THREADS
                value: "1"
              - name: VLLM_SERVER_DEV_MODE
                value: "1"
              - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                value: "120"
              - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
                value: "1"
              - name: TORCH_CPP_LOG_LEVEL
                value: ERROR
              - name: TRITON_LIBCUDA_PATH
                value: /usr/lib64
              - name: VLLM_CACHE_ROOT
                value: /var/cache/vllm/vllm
              - name: CUDA_CACHE_PATH
                value: /var/cache/vllm/cuda
              - name: FLASHINFER_WORKSPACE_BASE
                value: /var/cache/vllm/flashinfer
              - name: DG_JIT_CACHE_DIR
                value: /var/cache/vllm/deep_gemm
              - name: GLOO_SOCKET_IFNAME
                value: eth0
              - name: NCCL_SOCKET_IFNAME
                value: eth0
              - name: NCCL_NET
                value: IB
              - name: NCCL_IB_DISABLE
                value: "0"
              - name: NCCL_IB_HCA
                value: mlx5_1,mlx5_2,mlx5_3,mlx5_4,mlx5_5,mlx5_6,mlx5_7,mlx5_8
              - name: EP_NIC_NAME
                value: mlx5_1
              - name: NCCL_IB_GID_INDEX
                value: "3"
              - name: NCCL_IB_ADDR_FAMILY
                value: AF_INET
              - name: UCX_TLS
                value: rc,cuda_copy,cuda_ipc
              - name: UCX_NET_DEVICES
                value: mlx5_1:1,mlx5_2:1,mlx5_3:1,mlx5_4:1,mlx5_5:1,mlx5_6:1,mlx5_7:1,mlx5_8:1
              - name: UCX_IB_GID_INDEX
                value: "3"
              - name: NVIDIA_GDRCOPY
                value: enabled
              - name: NVSHMEM_REMOTE_TRANSPORT
                value: ibgda
              - name: NVSHMEM_IB_ENABLE_IBGDA
                value: "true"
              - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
                value: eth0
              - name: NVSHMEM_SYMMETRIC_SIZE
                value: 4G
              - name: NVSHMEM_IB_ADDR_RANGE
                value: 0.0.0.0/0
              - name: NVSHMEM_ENABLE_NIC_PE_MAPPING
                value: "0"
              - name: NVSHMEM_IB_GID_INDEX
                value: "3"
              - name: NVSHMEM_HCA_PREFIX
                value: mlx5
              image: us.icr.io/llmd/llm-d-cuda@sha256:43f1297937b36cd973a2cde4d5137a3ffaebc1de78c8e28c97e8a17515e07d1c
              imagePullPolicy: IfNotPresent
              livenessProbe:
                httpGet:
                  path: /health
                  port: vllm-rank0
                periodSeconds: 30
                timeoutSeconds: 5
              name: vllm
              ports:
              - containerPort: 8000
                name: vllm-rank0
                protocol: TCP
              - containerPort: 5557
                name: kv-events
                protocol: TCP
              readinessProbe:
                httpGet:
                  path: /health
                  port: vllm-rank0
                periodSeconds: 10
                timeoutSeconds: 5
              resources:
                limits:
                  cpu: "64"
                  ephemeral-storage: 128Gi
                  memory: 1500Gi
                  nvidia.com/gpu: "8"
                  nvidia.com/roce_gdr: "8"
                requests:
                  cpu: "64"
                  ephemeral-storage: 128Gi
                  memory: 1500Gi
                  nvidia.com/gpu: "8"
                  nvidia.com/roce_gdr: "8"
              securityContext:
                capabilities:
                  add:
                  - IPC_LOCK
                  - SYS_RAWIO
                privileged: true
                runAsGroup: 0
                runAsUser: 0
              startupProbe:
                failureThreshold: 2700
                httpGet:
                  path: /health
                  port: vllm-rank0
                periodSeconds: 1
                timeoutSeconds: 5
              volumeMounts:
              - mountPath: /dev/shm
                name: dshm
              - mountPath: /var/cache/vllm
                name: jit-cache
              - mountPath: /model-cache
                name: model-cache
                readOnly: true
                subPath: rits-models
              - mountPath: /dev/infiniband
                name: dev-infiniband
              - mountPath: /vllm-patches
                name: vllm-patches
                readOnly: true
            initContainers:
            - args:
              - |
                for rail in {0..7}; do
                  iface="net$((rail + 1))"
                  table="$((100 + rail))"
                  gateway="10.${rail}.0.1"
                  ip route replace default via "${gateway}" dev "${iface}" table "${table}"
                done
              command:
              - /bin/bash
              - -ceu
              image: quay.io/dagray/rdma-tools:tiny
              imagePullPolicy: IfNotPresent
              name: install-crossrail-routes
              securityContext:
                capabilities:
                  add:
                  - NET_ADMIN
                privileged: true
                runAsGroup: 0
                runAsUser: 0
            - args:
              - until [ -f /model-cache/models/zai-org/GLM-5.3/config.json ]; do echo
                'config.json not visible; waiting 10s'; sleep 10; done
              command:
              - sh
              - -c
              image: docker.io/library/busybox:1.36
              imagePullPolicy: IfNotPresent
              name: verify-model-mount
              securityContext:
                seLinuxOptions:
                  type: spc_t
              volumeMounts:
              - mountPath: /model-cache
                name: model-cache
                readOnly: true
                subPath: rits-models
            serviceAccountName: glm-5-2
            terminationGracePeriodSeconds: 90
            tolerations:
            - effect: NoSchedule
              key: nvidia.com/gpu
              operator: Exists
            volumes:
            - emptyDir:
                medium: Memory
                sizeLimit: 1000Gi
              name: dshm
            - name: model-cache
              persistentVolumeClaim:
                claimName: glm52-canary-model-cache-rox-pvc
                readOnly: true
            - hostPath:
                path: /mnt/local/jit-cache-llm-d-cuda-ubuntu-sha-bbeed78
                type: DirectoryOrCreate
              name: jit-cache
            - hostPath:
                path: /dev/infiniband
                type: Directory
              name: dev-infiniband
            - configMap:
                name: vllm-startup-patches
              name: vllm-patches
      replicas: 1
  - name: decode
    spec:
      leaderWorkerTemplate:
        restartPolicy: RecreateGroupOnPodRestart
        size: 4
        workerTemplate:
          metadata:
            annotations:
              k8s.v1.cni.cncf.io/networks: |-
                [
                  {"name":"deepep-ll-port-1"},
                  {"name":"deepep-ll-port-2"},
                  {"name":"deepep-ll-port-3"},
                  {"name":"deepep-ll-port-4"},
                  {"name":"deepep-ll-port-5"},
                  {"name":"deepep-ll-port-6"},
                  {"name":"deepep-ll-port-7"},
                  {"name":"deepep-ll-port-8"}
                ]
            labels:
              llm-d.ai/guide: glm53-pcp-canary
              llm-d.ai/key: glm53-pcp-decode-dp16tp2
              llm-d.ai/model: GLM-5.3
              llm-d.ai/role: decode
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                  - matchExpressions:
                    - key: nvidia.com/gpu.product
                      operator: In
                      values:
                      - NVIDIA-H100-80GB-HBM3
                    - key: rits.node-model-cache-enabled
                      operator: In
                      values:
                      - ""
                    - key: llm-d.ai/glm53-cache
                      operator: In
                      values:
                      - ready
            containers:
            - args:
              - |-
                set -euo pipefail

                find /dev/shm -type f -delete

                # Startup patches to the installed vLLM, from the vllm-startup-patches
                # ConfigMap (patches/*.py, see kustomization.yaml), applied in name
                # order. Each stops the container if its target code is missing, so
                # vLLM never serves unpatched; see the header of each file.
                for VLLM_PATCH in /vllm-patches/*.py; do
                  echo "vllm startup patch: $(basename "$VLLM_PATCH")"
                  python3 "$VLLM_PATCH"
                done

                START_RANK=$(( LWS_WORKER_INDEX * DP_SIZE_LOCAL ))

                # LL keeps one RDMA queue entry per in-flight dispatch token; the
                # live decode LWS sizes this as (batch + 1) * 2.
                export NVSHMEM_QP_DEPTH=$(( (MAX_NUM_BATCHED_TOKENS + 1) * 2 ))

                exec vllm serve /model-cache/models/zai-org/GLM-5.3 \
                  --release-weight-page-cache \
                  --served-model-name zai-org/GLM-5.3 \
                  --port 8200 \
                  --trust-remote-code \
                  --max-model-len 275000 \
                  --kv-cache-dtype fp8 \
                  --speculative-config "{\"method\":\"mtp\",\"num_speculative_tokens\":${SPEC_TOKENS}}" \
                  --reasoning-parser glm45 \
                  --tool-call-parser glm47 \
                  --enable-auto-tool-choice \
                  --disable-access-log-for-endpoints=/health,/metrics \
                  --enable-expert-parallel \
                  --tensor-parallel-size "${TP_SIZE}" \
                  --data-parallel-size $(( LWS_GROUP_SIZE * DP_SIZE_LOCAL )) \
                  --data-parallel-size-local "${DP_SIZE_LOCAL}" \
                  --data-parallel-start-rank "${START_RANK}" \
                  --data-parallel-address "${LWS_LEADER_ADDRESS}" \
                  --data-parallel-rpc-port 5555 \
                  --data-parallel-multi-port-external-lb \
                  --data-parallel-supervisor-port 8208 \
                  --moe-backend deep_gemm \
                  --all2all-backend deepep_low_latency \
                  --enable-ep-weight-filter \
                  --safetensors-load-strategy lazy \
                  --no-enable-flashinfer-autotune \
                  --max-num-seqs "${MAX_NUM_SEQS}" \
                  --max-num-batched-tokens "${MAX_NUM_BATCHED_TOKENS}" \
                  --long-prefill-token-threshold "${MAX_NUM_BATCHED_TOKENS}" \
                  --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_load_failure_policy":"fail"}'
              command:
              - /bin/bash
              - -c
              env:
              - name: TP_SIZE
                value: "2"
              - name: DP_SIZE_LOCAL
                value: "4"
              - name: MAX_NUM_SEQS
                value: "8"
              - name: SPEC_TOKENS
                value: "3"
              - name: MAX_NUM_BATCHED_TOKENS
                value: "32"
              - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              - name: HF_HOME
                value: /model-cache
              - name: PYTHONHASHSEED
                value: "0"
              - name: OMP_NUM_THREADS
                value: "1"
              - name: OPENBLAS_NUM_THREADS
