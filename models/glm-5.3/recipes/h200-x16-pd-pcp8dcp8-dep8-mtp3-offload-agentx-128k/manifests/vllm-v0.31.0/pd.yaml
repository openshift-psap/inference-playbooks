        - --tool-call-parser=glm47
        - --reasoning-parser=glm45
        - --port=8200
        - --data-parallel-size-local=8
        - --data-parallel-multi-port-external-lb
        - --all2all-backend=deepep_low_latency
        - --gpu-memory-utilization=0.97
        - --max-num-batched-tokens=512
        - --max-num-seqs=64
        - --kv-transfer-config={"kv_connector":"MultiConnector","kv_role":"kv_both","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_connector_extra_config":{"enforce_handshake_compat":false,"num_threads":1}},{"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{"spec_name":"TieringOffloadingSpec","cpu_bytes_to_use":68719476736}}]}}
        - --data-parallel-size=8
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        - name: HOME
          value: /tmp
        - name: HF_HOME
          value: /home/nobody/.cache/huggingface
        - name: UCX_TLS
          value: rc,cuda_copy,cuda_ipc,self,sm,tcp
        - name: NVSHMEM_QP_DEPTH
          value: '1026'
        - name: VLLM_NIXL_SIDE_CHANNEL_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        resources:
          requests:
            cpu: '48'
            memory: 1500Gi
            nvidia.com/gpu: '8'
            rdma/ib: '8'
          limits:
            memory: 1500Gi
            nvidia.com/gpu: '8'
            rdma/ib: '8'
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: hf-cache
          mountPath: /home/nobody/.cache
        securityContext:
          runAsUser: 0
        startupProbe:
          httpGet:
            path: /health
            port: 9256
          periodSeconds: 10
          failureThreshold: 360
        readinessProbe:
          httpGet:
            path: /health
            port: 9256
          periodSeconds: 10
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 576Gi
      - name: hf-cache
        emptyDir: {}
      initContainers:
      - name: routing-proxy
        image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:v0.9.0
        restartPolicy: Always
        args:
        - --port=8000
        - --vllm-port=8200
        - --data-parallel-size=8
        - --secure-proxy=false
        - --connector=nixlv2
        ports:
        - containerPort: 8000
        - containerPort: 8001
        - containerPort: 8002
        - containerPort: 8003
        - containerPort: 8004
        - containerPort: 8005
        - containerPort: 8006
        - containerPort: 8007
