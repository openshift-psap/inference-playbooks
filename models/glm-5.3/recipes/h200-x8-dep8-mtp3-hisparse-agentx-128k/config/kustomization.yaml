apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../manifests/vllm-v0.31.0/deployment.yaml
patches:
  - path: shm.yaml
  # Let OpenShift assign the namespace UID under restricted-v2.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: glm-5-3-dep8-mtp3-hisparse
    patch: |-
      - op: remove
        path: /spec/template/spec/securityContext/runAsUser
