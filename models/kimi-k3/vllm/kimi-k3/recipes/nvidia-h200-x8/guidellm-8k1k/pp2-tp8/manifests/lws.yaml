apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: kimi-k3-pp2
  labels:
    app.kubernetes.io/name: kimi-k3-pp2
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 2
    restartPolicy: RecreateGroupOnPodRestart
    leaderTemplate:
      metadata:
        labels:
          app.kubernetes.io/name: kimi-k3-pp2
          leaderworkerset.sigs.k8s.io/worker-index: "0"
      spec:
        containers:
          - name: vllm
            image: docker.io/vllm/vllm-openai@sha256:e90e2603b2781936651ba019804137714367c69e10a7b25a2e57b46995225616
            imagePullPolicy: IfNotPresent
            command: ["/bin/bash", "-c"]
            args:
              - |
                exec vllm serve /models/Kimi-K3 \
                  --tensor-parallel-size 8 \
                  --pipeline-parallel-size 2 \
                  --nnodes 2 \
                  --node-rank 0 \
                  --master-addr 0.0.0.0 \
                  --port 8000 \
                  --trust-remote-code \
                  --attention-backend FLASHMLA \
                  --moe-backend marlin \
                  --gpu-memory-utilization 0.90 \
                  --max-num-seqs 256 \
                  --max-model-len 8192 \
                  --max-num-batched-tokens 4096 \
                  --disable-custom-all-reduce \
                  --no-enable-flashinfer-autotune \
                  --enable-auto-tool-choice \
                  --tool-call-parser kimi_k3 \
                  --reasoning-parser kimi_k3
            env:
              - {name: NCCL_DMABUF_ENABLE, value: "0"}
              - {name: VLLM_USE_RUST_FRONTEND, value: "0"}
              - {name: VLLM_USE_V2_MODEL_RUNNER, value: "1"}
              - {name: HF_HOME, value: /models/hf}
              - {name: HOME, value: /tmp}
              - {name: FLASHINFER_WORKSPACE_BASE, value: /tmp}
              - {name: TRITON_CACHE_DIR, value: /tmp/triton-cache}
            ports:
              - {name: http, containerPort: 8000, protocol: TCP}
            resources:
              requests:
                cpu: "32"
                memory: 512Gi
                composite.dra/gpu-nic-pair: "8"
              limits:
                memory: 512Gi
                composite.dra/gpu-nic-pair: "8"
            startupProbe:
              httpGet: {path: /health, port: 8000}
              periodSeconds: 10
              failureThreshold: 720
            readinessProbe:
              httpGet: {path: /health, port: 8000}
              periodSeconds: 10
              timeoutSeconds: 5
            volumeMounts:
              - {name: model, mountPath: /models}
              - {name: dshm, mountPath: /dev/shm}
        volumes:
          - name: model
            persistentVolumeClaim:
              claimName: model
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 16Gi
    workerTemplate:
      metadata:
        labels:
          app.kubernetes.io/name: kimi-k3-pp2
      spec:
        containers:
          - name: vllm
            image: docker.io/vllm/vllm-openai@sha256:e90e2603b2781936651ba019804137714367c69e10a7b25a2e57b46995225616
            imagePullPolicy: IfNotPresent
            command: ["/bin/bash", "-c"]
            args:
              - |
                exec vllm serve /models/Kimi-K3 \
                  --tensor-parallel-size 8 \
                  --pipeline-parallel-size 2 \
                  --nnodes 2 \
                  --node-rank $(LWS_WORKER_INDEX) \
                  --master-addr $(LWS_LEADER_ADDRESS) \
                  --headless \
                  --port 8000 \
                  --trust-remote-code \
                  --attention-backend FLASHMLA \
                  --moe-backend marlin \
                  --gpu-memory-utilization 0.90 \
                  --max-num-seqs 256 \
                  --max-model-len 8192 \
                  --max-num-batched-tokens 4096 \
                  --disable-custom-all-reduce \
                  --no-enable-flashinfer-autotune \
                  --enable-auto-tool-choice \
                  --tool-call-parser kimi_k3 \
                  --reasoning-parser kimi_k3
            env:
              - {name: NCCL_DMABUF_ENABLE, value: "0"}
              - {name: VLLM_USE_RUST_FRONTEND, value: "0"}
              - {name: VLLM_USE_V2_MODEL_RUNNER, value: "1"}
              - {name: HF_HOME, value: /models/hf}
              - {name: HOME, value: /tmp}
              - {name: FLASHINFER_WORKSPACE_BASE, value: /tmp}
              - {name: TRITON_CACHE_DIR, value: /tmp/triton-cache}
            ports:
              - {name: http, containerPort: 8000, protocol: TCP}
            resources:
              requests:
                cpu: "32"
                memory: 512Gi
                composite.dra/gpu-nic-pair: "8"
              limits:
                memory: 512Gi
                composite.dra/gpu-nic-pair: "8"
            startupProbe:
              httpGet: {path: /health, port: 8000}
              periodSeconds: 10
              failureThreshold: 720
            readinessProbe:
              httpGet: {path: /health, port: 8000}
              periodSeconds: 10
              timeoutSeconds: 5
            volumeMounts:
              - {name: model, mountPath: /models}
              - {name: dshm, mountPath: /dev/shm}
        volumes:
          - name: model
            persistentVolumeClaim:
              claimName: model
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 16Gi
