schema_version: 1
profile:
  label: Kimi K3 throughput on two H200 nodes
  headline: TP8×PP2 with the Humming MoE backend is the strongest measured 16-GPU Kimi K3 configuration.
  specs:
    - {label: Checkpoint, value: moonshotai/Kimi-K3}
    - {label: Hardware, value: 2 nodes · 8× H200 per node}
    - {label: Parallelism, value: TP=8 × PP=2}
    - {label: Precision, value: MXFP4 weights}
    - {label: Context, value: 8,192 tokens}
    - {label: Backend, value: Humming MoE}
decisions:
  - subjects: [tensor parallelism, pipeline parallelism]
    why: The Kimi K3 sweep found PP2 substantially faster than cross-node TP16 for throughput workloads.
  - subjects: [moe backend]
    why: Humming reached approximately 3,804 output tok/s versus approximately 2,202 tok/s for PP2 with Marlin in the same 1000-in/1000-out sweep.
  - subjects: [NCCL_IB_HCA, NCCL_IB_GID_INDEX]
    why: The tested PP2 cluster required the IPv4-mapped RoCE path for cross-node P2P.
known_issues:
  - issue: Humming requires the Kimi-specific MoEActivation.SITU allowlist patch.
    impact: The server will fail during backend setup if the image does not already contain the allowlist entry.
    mitigation: The source manifest applies the narrow allowlist insertion before starting vLLM; prefer an image with the upstream fix once available.
  - issue: The model weights are approximately 1.56 TB and are expected on local hostPath NVMe.
    impact: Each node needs a complete local copy and pods are tied to nodes with populated storage.
    mitigation: Stage and verify /mnt/local/kimi-k3/models/Kimi-K3 before deployment.
  - issue: The benchmark evidence used 1000 input and 1000 output tokens rather than the standard 8K/1K GuideLLM profile.
    impact: The published throughput numbers are directional and do not validate this catalog workload profile.
    mitigation: Run the repository-standard GuideLLM 8K/1K benchmark before changing maturity from day-zero.
quickstart:
  - {step: Prepare, detail: Install the LeaderWorkerSet controller and stage moonshotai/Kimi-K3 on both nodes at /mnt/local/kimi-k3/models/Kimi-K3.}
  - {step: Network, detail: Verify the provider-specific RoCE HCA and GID values; keep NCCL_IB_HCA and NCCL_IB_GID_INDEX symmetric.}
  - {step: Deploy, detail: Apply config/lws.yaml and config/service.yaml together.}
  - {step: Verify, detail: Wait for the leader health probe, then query /v1/models through the Service.}
