# GLM-5.2-FP8 across 2× 8×H200 nodes: PP=2, TP=8 via LLMInferenceService.
# Cross-node communication: RDMA via composite DRA (GPU + NIC pairs).
#
# Validated on janus (OCP 4.22, RHOAI 3.5.0 GA, 2×8×H200) with real
# FP8 weights from NFS PVC. RHOAI vLLM v0.24.0 (no upstream override).
#
# For clusters without composite DRA, use
# pp2-tp8-llmisvc-pod-net.yaml instead.
#
# Prerequisites:
# - Composite DRA driver installed (GPU + NIC pair allocation)
# - LLMInferenceServiceConfig for pipeline-parallel worker must exist
#   (see ../../../prerequisites/pp-worker-llmisvcconfig.yaml)
# - KServe with LLMInferenceService v1alpha2 support
# - LeaderWorkerSet controller installed (kubernetes-sigs/lws)
# - Secret llm-d-hf-token with key HF_TOKEN in the target namespace
# - Model weights pre-loaded to a PVC (~756 GB)
# - MachineConfig: memlock unlimited for CRI-O (required for RDMA)
# - MachineConfig: topologyManagerPolicy best-effort (for 8 GPU+NIC)
#
# NOTE: The composite DRA driver domain is cluster-specific.
# Use composite.dra.io/gpu-nic-pair or composite.dra/gpu-nic-pair
# depending on which driver is installed. Check with:
#   oc get resourceslices -o json | jq '.items[].spec.driver' | sort -u
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: glm52-pp
spec:
  model:
    uri: pvc://glm52-fp8-weights
    name: glm-5.2-fp8
  storageInitializer:
    enabled: false
  replicas: 1
  parallelism:
    pipeline: 2
    tensor: 8
  template:
    containers:
      - name: main
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: llm-d-hf-token
                key: HF_TOKEN
          - name: VLLM_ADDITIONAL_ARGS
            value: >-
              --kv-cache-dtype fp8
              --tool-call-parser glm47
              --reasoning-parser glm45
              --enable-auto-tool-choice
              --skip-mm-profiling
              --trust-remote-code
              --distributed-timeout-seconds 3600
          - name: VLLM_ENGINE_READY_TIMEOUT_S
            value: "3600"
          - name: KSERVE_INFER_ROCE
            value: "true"
          - name: NCCL_IB_GID_INDEX
            value: "3"
        resources:
          requests:
            cpu: 32
            memory: 256Gi
            composite.dra.io/gpu-nic-pair: "8"
            # Suppress nvidia.com/gpu auto-insertion by the
            # LLMInferenceServiceConfig template merge;
            # GPUs are allocated via composite DRA instead.
            nvidia.com/gpu: "0"
          limits:
            memory: 1024Gi
            composite.dra.io/gpu-nic-pair: "8"
            nvidia.com/gpu: "0"
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          failureThreshold: 720
          periodSeconds: 10
        volumeMounts:
          - name: dshm
            mountPath: /dev/shm
          - name: models
            mountPath: /mnt/models
    volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
      - name: models
        persistentVolumeClaim:
          claimName: glm52-fp8-weights
  worker:
    containers:
      - name: main
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: llm-d-hf-token
                key: HF_TOKEN
          - name: VLLM_ADDITIONAL_ARGS
            value: >-
              --kv-cache-dtype fp8
              --tool-call-parser glm47
              --reasoning-parser glm45
              --enable-auto-tool-choice
              --skip-mm-profiling
              --trust-remote-code
              --distributed-timeout-seconds 3600
          - name: VLLM_ENGINE_READY_TIMEOUT_S
            value: "3600"
          - name: KSERVE_INFER_ROCE
            value: "true"
          - name: NCCL_IB_GID_INDEX
            value: "3"
        resources:
          requests:
            cpu: 32
            memory: 256Gi
            composite.dra.io/gpu-nic-pair: "8"
            nvidia.com/gpu: "0"
          limits:
            memory: 1024Gi
            composite.dra.io/gpu-nic-pair: "8"
            nvidia.com/gpu: "0"
        volumeMounts:
          - name: dshm
            mountPath: /dev/shm
          - name: models
            mountPath: /mnt/models
    volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
      - name: models
        persistentVolumeClaim:
          claimName: glm52-fp8-weights
