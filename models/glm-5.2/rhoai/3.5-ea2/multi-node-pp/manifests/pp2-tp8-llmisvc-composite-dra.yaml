# GLM-5.2-FP8 across 2× 8×H200 nodes: PP=2, TP=8 via LLMInferenceService.
# Cross-node communication: RDMA via composite DRA (GPU + NIC pairs).
#
# Uses composite.dra/gpu-nic-pair resource instead of nvidia.com/gpu.
# The DRA driver co-allocates each GPU with its nearest RDMA NIC,
# ensuring NCCL uses RDMA for cross-node PP activation transfer.
#
# For clusters without composite DRA, use
# pp2-tp8-llmisvc-pod-net.yaml instead.
#
# Prerequisites:
# - Composite DRA driver installed (GPU + NIC pair allocation)
# - LLMInferenceServiceConfig for pipeline-parallel worker must exist
#   (see ../../../prerequisites/pp-worker-llmisvcconfig.yaml)
# - KServe with LLMInferenceService v1alpha2 support
# - LeaderWorkerSet controller installed (kubernetes-sigs/lws)
# - Secret llm-d-hf-token with key HF_TOKEN in the target namespace
# - Model weights pre-loaded to PVC or hostPath (~756 GB)
#
# GLM-5.2 requires vLLM >= v0.23.0. If the RHOAI-shipped image
# includes v0.23.0+, remove the image override below to use it.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: glm52-pp
spec:
  model:
    # For PVC-backed weights (recommended for 756 GB model):
    #   uri: pvc://glm52-weights
    # For HuggingFace download (slow, re-downloads on restart):
    uri: hf://zai-org/GLM-5.2-FP8
    name: glm-5.2-fp8
  replicas: 1
  parallelism:
    pipeline: 2
    tensor: 8
  template:
    containers:
      - name: main
        # Override needed: GLM-5.2 requires vLLM >= v0.23.0.
        # Remove once RHOAI ships v0.23.0+ in its vLLM image.
        image: vllm/vllm-openai:v0.23.0
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: llm-d-hf-token
                key: HF_TOKEN
          - name: VLLM_ADDITIONAL_ARGS
            value: >-
              --kv-cache-dtype fp8
              --tool-call-parser glm47
              --reasoning-parser glm45
              --enable-auto-tool-choice
              --skip-mm-profiling
              --trust-remote-code
              --distributed-timeout-seconds 1200
          - name: KSERVE_INFER_ROCE
            value: "true"
        resources:
          requests:
            cpu: 32
            memory: 256Gi
            composite.dra/gpu-nic-pair: "8"
            # Suppress nvidia.com/gpu auto-insertion by the
            # LLMInferenceServiceConfig template merge;
            # GPUs are allocated via composite DRA instead.
            nvidia.com/gpu: "0"
          limits:
            memory: 512Gi
            composite.dra/gpu-nic-pair: "8"
            # Suppress nvidia.com/gpu auto-insertion by the
            # LLMInferenceServiceConfig template merge;
            # GPUs are allocated via composite DRA instead.
            nvidia.com/gpu: "0"
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          failureThreshold: 720
          periodSeconds: 10
        volumeMounts:
          - name: dshm
            mountPath: /dev/shm
    volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
  worker:
    containers:
      - name: main
        image: vllm/vllm-openai:v0.23.0
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: llm-d-hf-token
                key: HF_TOKEN
          - name: VLLM_ADDITIONAL_ARGS
            value: >-
              --kv-cache-dtype fp8
              --tool-call-parser glm47
              --reasoning-parser glm45
              --enable-auto-tool-choice
              --skip-mm-profiling
              --trust-remote-code
              --distributed-timeout-seconds 1200
          - name: KSERVE_INFER_ROCE
            value: "true"
        resources:
          requests:
            cpu: 32
            memory: 256Gi
            composite.dra/gpu-nic-pair: "8"
            # Suppress nvidia.com/gpu auto-insertion by the
            # LLMInferenceServiceConfig template merge;
            # GPUs are allocated via composite DRA instead.
            nvidia.com/gpu: "0"
          limits:
            memory: 512Gi
            composite.dra/gpu-nic-pair: "8"
            # Suppress nvidia.com/gpu auto-insertion by the
            # LLMInferenceServiceConfig template merge;
            # GPUs are allocated via composite DRA instead.
            nvidia.com/gpu: "0"
        volumeMounts:
          - name: dshm
            mountPath: /dev/shm
    volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
