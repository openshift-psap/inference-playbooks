apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  labels:
    app.kubernetes.io/component: aggregated-b200
    app.kubernetes.io/name: glm-5-2
    llm-d.ai/model: glm5.2
    llm-d.ai/profile: aggregated-b200
  name: glm-5-2-aggregated-b200
spec:
  baseRefs:
  - name: v3-5-0-kserve-config-llm-template
  - name: v3-5-0-kserve-config-llm-single-node-template-nvidia-cuda
  - name: v3-5-0-kserve-config-llm-scheduler
  - name: v3-5-0-kserve-config-llm-router-route
  model:
    name: RedHatAI/GLM-5.2-NVFP4-FP8
    uri: pvc://glm-5-2-hf-cache
  parallelism:
    tensor: 8
  replicas: 0
  router:
    route: {}
    scheduler: {}
  storageInitializer:
    enabled: false
  template:
    containers:
    - command:
      - /bin/bash
      - -c
      - |-
        set -euo pipefail
        # Recipe values are whitespace-free, including compact speculative JSON.
        # Array splitting preserves JSON quotes without eval or pathname expansion.
        read -r -a serving_args <<< "${VLLM_ADDITIONAL_ARGS}"
        exec vllm serve "{{ .Spec.Model.Name }}" \
          --port 8000 \
          --tensor-parallel-size "{{ .Spec.Parallelism.Tensor }}" \
          "${serving_args[@]}" \
          {{ if .GlobalConfig.EnableTLS }}--enable-ssl-refresh \
          --ssl-certfile /var/run/kserve/tls/tls.crt \
          --ssl-keyfile /var/run/kserve/tls/tls.key{{ end }}
      env:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            key: HF_TOKEN
            name: llm-d-hf-token
      - name: VLLM_ADDITIONAL_ARGS
        value: --disable-access-log-for-endpoints /health,/metrics,/v1/models --max-num-seqs
          64 --max-num-batched-tokens 8192 --max-cudagraph-capture-size 256 --long-prefill-token-threshold
          4096 --enable-expert-parallel --moe-backend auto --speculative-config {"method":"mtp","num_speculative_tokens":3}
          --kv-cache-dtype fp8 --load-format instanttensor
      - name: PYTHONPATH
        value: /opt/pydeps
      - name: HF_HUB_OFFLINE
        value: "0"
      - name: TRANSFORMERS_OFFLINE
        value: "0"
      - name: VLLM_USE_V2_MODEL_RUNNER
        value: "1"
      - name: TORCH_CPP_LOG_LEVEL
        value: ERROR
      - name: HF_HUB_CACHE
        value: /var/cache/huggingface
      - name: VLLM_CACHE_ROOT
        value: /var/cache/vllm/vllm
      - name: FLASHINFER_WORKSPACE_BASE
        value: /var/cache/vllm/flashinfer
      - name: CUDA_CACHE_PATH
        value: /var/cache/vllm/cuda
      image: docker.io/vllm/vllm-openai:v0.27.0
      imagePullPolicy: IfNotPresent
      livenessProbe:
        failureThreshold: 3
        httpGet:
          path: /health
          port: 8000
          scheme: '{{ if .GlobalConfig.EnableTLS }}HTTPS{{else}}HTTP{{end}}'
        periodSeconds: 30
        timeoutSeconds: 10
      name: main
      readinessProbe:
        failureThreshold: 60
        httpGet:
          path: /health
          port: 8000
          scheme: '{{ if .GlobalConfig.EnableTLS }}HTTPS{{else}}HTTP{{end}}'
        periodSeconds: 10
        timeoutSeconds: 5
      resources:
        limits:
          ephemeral-storage: 1Ti
          memory: 512Gi
          nvidia.com/gpu: "8"
        requests:
          cpu: "64"
          ephemeral-storage: 1Ti
          memory: 512Gi
          nvidia.com/gpu: "8"
      startupProbe:
        failureThreshold: 270
        httpGet:
          path: /health
          port: 8000
          scheme: '{{ if .GlobalConfig.EnableTLS }}HTTPS{{else}}HTTP{{end}}'
        periodSeconds: 10
        timeoutSeconds: 5
      volumeMounts:
      - mountPath: /dev/shm
        name: dshm
      - mountPath: /var/cache/huggingface
        name: hf-cache
      - mountPath: /var/cache/vllm
        name: jit-cache
      - mountPath: /opt/pydeps
        name: pydeps
    initContainers:
    - command:
      - /bin/bash
      - -lc
      - python3 -m pip install --no-cache-dir --no-deps --index-url https://pypi.org/simple
        --target /opt/pydeps instanttensor==0.1.9
      image: docker.io/vllm/vllm-openai:v0.27.0
      name: install-instanttensor
      volumeMounts:
      - mountPath: /opt/pydeps
        name: pydeps
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-B200
    volumes:
    - emptyDir:
        medium: Memory
        sizeLimit: 2Gi
      name: dshm
    - name: hf-cache
      persistentVolumeClaim:
        claimName: glm-5-2-hf-cache
    - name: jit-cache
      persistentVolumeClaim:
        claimName: glm-5-2-jit-cache
    - emptyDir: {}
      name: pydeps
