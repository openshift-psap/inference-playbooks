apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: inference-playbooks
    app.kubernetes.io/name: b200-x8-tp8-ep-mtp3-guidellm-8k1k
  name: b200-x8-tp8-ep-mtp3-guidellm-8k1k
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: b200-x8-tp8-ep-mtp3-guidellm-8k1k
  template:
    metadata:
      labels:
        app.kubernetes.io/name: b200-x8-tp8-ep-mtp3-guidellm-8k1k
    spec:
      containers:
      - args:
        - RedHatAI/GLM-5.2-NVFP4-FP8
        - --served-model-name=RedHatAI/GLM-5.2-NVFP4-FP8
        - --disable-access-log-for-endpoints=/health,/metrics,/v1/models
        - --max-num-seqs=64
        - --max-num-batched-tokens=8192
        - --max-cudagraph-capture-size=256
        - --long-prefill-token-threshold=4096
        - --enable-expert-parallel
        - --moe-backend=auto
        - --speculative-config={"method":"mtp","num_speculative_tokens":3}
        - --kv-cache-dtype=fp8
        - --load-format=instanttensor
        - --tensor-parallel-size=8
        command:
        - /bin/bash
        - -c
        - |
          vllm serve "$@"
        - --
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              key: HF_TOKEN
              name: llm-d-hf-token
        - name: PYTHONPATH
          value: /opt/pydeps
        - name: HF_HUB_OFFLINE
          value: "0"
        - name: TRANSFORMERS_OFFLINE
          value: "0"
        - name: VLLM_USE_V2_MODEL_RUNNER
          value: "1"
        - name: TORCH_CPP_LOG_LEVEL
          value: ERROR
        - name: HF_HUB_CACHE
          value: /var/cache/huggingface
        - name: VLLM_CACHE_ROOT
          value: /var/cache/vllm/vllm
        - name: FLASHINFER_WORKSPACE_BASE
          value: /var/cache/vllm/flashinfer
        - name: CUDA_CACHE_PATH
          value: /var/cache/vllm/cuda
        image: docker.io/vllm/vllm-openai:v0.27.0
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 30
          timeoutSeconds: 10
        name: vllm
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 60
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            ephemeral-storage: 1Ti
            memory: 512Gi
            nvidia.com/gpu: "8"
          requests:
            cpu: "64"
            ephemeral-storage: 1Ti
            memory: 512Gi
            nvidia.com/gpu: "8"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          failureThreshold: 270
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /var/cache/huggingface
          name: hf-cache
        - mountPath: /tmp
          name: tmp
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /var/cache/vllm
          name: jit-cache
        - mountPath: /opt/pydeps
          name: pydeps
      initContainers:
      - command:
        - /bin/bash
        - -lc
        - python3 -m pip install --no-cache-dir --no-deps --index-url https://pypi.org/simple
          --target /opt/pydeps instanttensor==0.1.9
        image: docker.io/vllm/vllm-openai:v0.27.0
        name: install-instanttensor
        volumeMounts:
        - mountPath: /opt/pydeps
          name: pydeps
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-B200
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: hf-cache
        persistentVolumeClaim:
          claimName: glm-5-2-hf-cache
      - emptyDir: {}
        name: tmp
      - emptyDir:
          medium: Memory
          sizeLimit: 2Gi
        name: dshm
      - name: jit-cache
        persistentVolumeClaim:
          claimName: glm-5-2-jit-cache
      - emptyDir: {}
        name: pydeps
