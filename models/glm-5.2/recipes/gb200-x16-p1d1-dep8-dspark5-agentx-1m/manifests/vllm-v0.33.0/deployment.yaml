apiVersion: v1
kind: ConfigMap
metadata:
  name: glm-5-2-gb200-p1d1-dep8-dspark5-epp-config
  labels:
    app.kubernetes.io/name: manifesto
    app.kubernetes.io/instance: glm-5-2-gb200-p1d1-dep8-dspark5
    llm-d.ai/owner: inference-playbooks
    app.kubernetes.io/component: routing
data:
  plugins.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: prefill-filter
    - type: decode-filter
    - type: inflight-load-producer
    - type: approx-prefix-cache-producer
      parameters:
        autoTune: false
        blockSizeTokens: 64
        maxPrefixTokensToMatch: 1048576
        maxPrefixBlocksToMatch: 4096
        lruCapacityPerServer: 159081
    - type: p2p-source-producer
      parameters:
        prefixMatchInfoProducerName: approx-prefix-cache-producer
        prefillProfileName: prefill
        minCachedTokenDelta: 6144
    - type: prefix-cache-affinity-filter
      parameters:
        peakPrefillThroughput: 4200
        maxTTFTPenaltyMs: 30000
        affinityThreshold: 0.8
    - type: prefix-cache-scorer
    - type: no-hit-lru-scorer
    - type: token-load-scorer
      parameters:
        queueThresholdTokens: 1290000
    - type: active-request-scorer
    - type: queue-scorer
    - type: always-disagg-pd-decider
    - type: disagg-profile-handler
      parameters:
        deciders:
          prefill: always-disagg-pd-decider
    - type: max-score-picker
      name: prefill-picker
    - type: max-score-picker
      name: decode-picker
    schedulingProfiles:
    - name: prefill
      plugins:
      - pluginRef: prefill-filter
      - pluginRef: prefix-cache-affinity-filter
      - pluginRef: prefix-cache-scorer
        weight: 10
      - pluginRef: no-hit-lru-scorer
        weight: 2
      - pluginRef: token-load-scorer
        weight: 3
      - pluginRef: queue-scorer
        weight: 3
      - pluginRef: prefill-picker
    - name: decode
      plugins:
      - pluginRef: decode-filter
      - pluginRef: active-request-scorer
        weight: 1
      - pluginRef: queue-scorer
        weight: 1
      - pluginRef: decode-picker
