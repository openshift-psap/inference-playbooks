apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: glm-5-2-vllm-lws-pp2-tp8
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 2
    restartPolicy: RecreateGroupOnPodRestart
    leaderTemplate:
      metadata:
        labels:
          role: leader
          app.kubernetes.io/name: glm-5-2-vllm-lws-pp2-tp8
          app.kubernetes.io/managed-by: inference-playbooks
      spec:
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: vllm-leader
            image: docker.io/vllm/vllm-openai:v0.23.0
            command: ["sh", "-c"]
            args:
              - |
                vllm serve zai-org/GLM-5.2-FP8 \
                  --served-model-name=zai-org/GLM-5.2-FP8 \
                  --tensor-parallel-size 8 \
                  --pipeline-parallel-size 2 \
                  --nnodes 2 \
                  --node-rank 0 \
                  --master-addr 0.0.0.0 \
                  --port 8080 \
                  --kv-cache-dtype=fp8 \
                  --tool-call-parser=glm47 \
                  --reasoning-parser=glm45 \
                  --enable-prefix-caching \
                  --enable-chunked-prefill \
                  --skip-mm-profiling \
                  --trust-remote-code \
                  --distributed-timeout-seconds=1200 \

            env:
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: hf-token
                    key: HF_TOKEN
            ports:
              - containerPort: 8080
            resources:
              requests:
                cpu: "32"
                memory: 256Gi
                nvidia.com/gpu: "8"
              limits:
                cpu: "8"
                memory: 512Gi
                nvidia.com/gpu: "8"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            startupProbe:
              httpGet:
                path: /health
                port: 8080
              failureThreshold: 720
              periodSeconds: 10
            readinessProbe:
              httpGet:
                path: /health
                port: 8080
              initialDelaySeconds: 15
              periodSeconds: 10
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: hf-cache
                mountPath: /home/nobody/.cache
              - name: tmp
                mountPath: /tmp
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 4Gi
          - name: hf-cache
            emptyDir: {}
          - name: tmp
            emptyDir: {}
    workerTemplate:
      spec:
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: vllm-worker
            image: docker.io/vllm/vllm-openai:v0.23.0
            command: ["sh", "-c"]
            args:
              - |
                vllm serve zai-org/GLM-5.2-FP8 \
                  --served-model-name=zai-org/GLM-5.2-FP8 \
                  --tensor-parallel-size 8 \
                  --pipeline-parallel-size 2 \
                  --nnodes 2 \
                  --node-rank $(LWS_WORKER_INDEX) \
                  --master-addr $(LWS_LEADER_ADDRESS) \
                  --headless \
                  --kv-cache-dtype=fp8 \
                  --tool-call-parser=glm47 \
                  --reasoning-parser=glm45 \
                  --enable-prefix-caching \
                  --enable-chunked-prefill \
                  --skip-mm-profiling \
                  --trust-remote-code \
                  --distributed-timeout-seconds=1200 \

            env:
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: hf-token
                    key: HF_TOKEN
            resources:
              requests:
                cpu: "32"
                memory: 256Gi
                nvidia.com/gpu: "8"
              limits:
                cpu: "8"
                memory: 512Gi
                nvidia.com/gpu: "8"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: hf-cache
                mountPath: /home/nobody/.cache
              - name: tmp
                mountPath: /tmp
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 4Gi
          - name: hf-cache
            emptyDir: {}
          - name: tmp
            emptyDir: {}
