---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: glm-5-2-gb200-tp8-dspark5-model-server
  labels:
    app.kubernetes.io/name: manifesto
    app.kubernetes.io/instance: glm-5-2-gb200-tp8-dspark5
    llm-d.ai/owner: inference-playbooks
    app.kubernetes.io/component: model-server
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: glm-5-2-gb200-tp8-dspark5-dcgm-metrics
  labels:
    app.kubernetes.io/name: manifesto
    app.kubernetes.io/instance: glm-5-2-gb200-tp8-dspark5
    llm-d.ai/owner: inference-playbooks
    app.kubernetes.io/component: monitoring
data:
  custom-counters.csv: |-
    DCGM_FI_PROF_NVLINK_TX_BYTES, gauge, NVLink transmit bytes per second
    DCGM_FI_PROF_NVLINK_RX_BYTES, gauge, NVLink receive bytes per second
    DCGM_FI_DEV_GPU_UTIL, gauge, GPU utilization
    DCGM_FI_DEV_FB_USED, gauge, Framebuffer memory used
    DCGM_FI_DEV_FB_FREE, gauge, Framebuffer memory free
---
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: glm-5-2-gb200-tp8-dspark5-vllm
  labels:
    app.kubernetes.io/name: manifesto
    app.kubernetes.io/instance: glm-5-2-gb200-tp8-dspark5
    llm-d.ai/owner: inference-playbooks
    app.kubernetes.io/component: lws
    llm-d.ai/role: decode
    llm-d.ai/inferenceServing: 'true'
    llm-d.ai/model: glm-5.2-nvfp4
    llm-d.ai/deployment: aggregated
spec:
  replicas: 1
  rolloutStrategy:
    type: RollingUpdate
    rollingUpdateConfiguration:
      maxUnavailable: 100%
  leaderWorkerTemplate:
    size: 2
    workerTemplate:
      metadata:
        labels:
          app.kubernetes.io/name: manifesto
          app.kubernetes.io/instance: glm-5-2-gb200-tp8-dspark5
          llm-d.ai/owner: inference-playbooks
          app.kubernetes.io/component: model-server
          llm-d.ai/role: decode
          llm-d.ai/inferenceServing: 'true'
          llm-d.ai/model: glm-5.2-nvfp4
          llm-d.ai/deployment: aggregated
      spec:
        serviceAccountName: glm-5-2-gb200-tp8-dspark5-model-server
        terminationGracePeriodSeconds: 0
        volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: shared-storage
          persistentVolumeClaim:
            claimName: lustre-pvc-vllm
        - name: local-nvme
          hostPath:
            path: /mnt/numa0
            type: Directory
        - name: dcgm-metrics
          configMap:
            name: glm-5-2-gb200-tp8-dspark5-dcgm-metrics
        - name: sys
          hostPath:
            path: /sys
            type: Directory
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        containers:
        - name: vllm
          image: docker.io/vllm/vllm-openai:v0.33.0
          imagePullPolicy: Always
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RAWIO
            runAsGroup: 0
            runAsUser: 0
          command:
          - /bin/bash
          - -c
          args:
          - |-
            set -euo pipefail
            LOG_DIR=/mnt/lustre/logs/decode
            mkdir -p "$LOG_DIR"
            LOG_FILE="$LOG_DIR/${HOSTNAME}_$(date +%Y%m%d-%H%M%S).log"
            exec > >(tee -a "$LOG_FILE") 2>&1
            echo "=== Pod $HOSTNAME started at $(date -Iseconds) ==="

            find /mnt/lustre/vllm-dev/vllm -name __pycache__ -type d -exec rm -rf {} + 2>/dev/null || true
            if [ -n "${MANIFESTO_VLLM_DEV_VENV:-}" ] && [ -d "${MANIFESTO_VLLM_DEV_VENV}" ]; then
              echo "Using dev venv at ${MANIFESTO_VLLM_DEV_VENV}"
              source "${MANIFESTO_VLLM_DEV_VENV}/bin/activate"
            elif [ -f /opt/vllm/bin/activate ]; then
              source /opt/vllm/bin/activate
            fi

            echo '=== Running pre-launch hooks ==='
            python3 -c "import nixl" 2>/dev/null || pip install -q \
              'nixl==1.5.0' 'cupy-cuda13x!=14.1.0'


            DP_SIZE_LOCAL=1
            START_RANK=0
            HEADLESS_FLAG=""
            if [ "${LWS_WORKER_INDEX:-0}" != "0" ]; then
              HEADLESS_FLAG="--headless"
            fi


            for R in $(seq 0 $((DP_SIZE_LOCAL - 1))); do
              GPU_START=$((R * 4))
              GPUS=$(seq -s, $GPU_START $((GPU_START + 4 - 1)))
              RANK=$((START_RANK + R))
              PORTS=(8000)
              PORT=${PORTS[$R]}
              VLLM_CACHE_ROOT=${VLLM_CACHE_ROOT}/rank${RANK} \
              FLASHINFER_CACHE_DIR=${FLASHINFER_CACHE_DIR}/rank${RANK} \
              FLASH_ATTENTION_CUTE_DSL_CACHE_DIR=${FLASH_ATTENTION_CUTE_DSL_CACHE_DIR}/decode_rank${RANK} \
              TILELANG_CACHE_DIR=${TILELANG_CACHE_DIR}/decode_rank${RANK} \
              vllm \
                serve \
                RedHatAI/GLM-5.2-NVFP4 \
                --device-ids $GPUS \
                --port $PORT \
                --tensor-parallel-size 8 \
                --nnodes 2 \
                --node-rank ${LWS_WORKER_INDEX} \
                --master-addr ${LWS_LEADER_ADDRESS} \
                $HEADLESS_FLAG \
                --served-model-name RedHatAI/GLM-5.2-NVFP4 \
                --load-format auto \
                --disable-uvicorn-access-log \
                --disable-custom-all-reduce \
                --trust-remote-code \
                --kv-cache-dtype fp8 \
                --max-model-len 1048576 \
                --disable-access-log-for-endpoints /health,/metrics \
                --reasoning-parser glm45 \
                --tool-call-parser glm47 \
                --enable-auto-tool-choice \
                --gpu-memory-utilization 0.9 \
                --max-num-seqs 16 \
                --max-num-batched-tokens 8192 \
                --max-cudagraph-capture-size 72 \
                --kv-cache-metrics \
                --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY","mode":0}' \
                --speculative-config '{"method":"dspark","model":"RedHatAI/GLM-5.2-speculator.dspark","num_speculative_tokens":5,"enable_adaptive_verification":true,"draft_sample_method":"probabilistic"}' \
                &
            done

            wait -n
            kill $(jobs -p) 2>/dev/null || true
            exit 1
          env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: HF_TOKEN
                optional: true
          - name: DG_JIT_CACHE_DIR
            value: /tmp/dg-cache-glm52-nvfp4
          - name: FLASHINFER_CACHE_DIR
            value: /mnt/lustre/jit-cache/gb200/cu13/v0.33.0/glm52-tp8-dspark5/flashinfer
          - name: FLASHINFER_WORKSPACE_BASE
            value: /mnt/lustre/jit-cache/gb200/cu13/v0.33.0/glm52-tp8-dspark5/flashinfer-workspace
          - name: FLASH_ATTENTION_CUTE_DSL_CACHE_DIR
            value: /mnt/lustre/jit-cache/gb200/cu13/v0.33.0/glm52-tp8-dspark5/fa-cute-dsl
          - name: FLASH_ATTENTION_CUTE_DSL_CACHE_ENABLED
            value: '1'
          - name: HF_HOME
            value: /mnt/local/hf_cache
          - name: HOME
            value: /mnt/lustre/jit-cache/gb200/cu13/v0.33.0/glm52-tp8-dspark5/home
          - name: MANIFESTO_VLLM_DEV_VENV
            value: ''
          - name: NCCL_CUMEM_ENABLE
            value: '1'
          - name: NCCL_MNNVL_ENABLE
            value: '1'
          - name: NCCL_NVLS_ENABLE
            value: '1'
          - name: NVIDIA_GDRCOPY
            value: enabled
          - name: PYTHONHASHSEED
            value: '0'
          - name: TILELANG_CACHE_DIR
            value: /mnt/lustre/jit-cache/gb200/cu13/v0.33.0/glm52-tp8-dspark5/tilelang
          - name: TILELANG_CLEANUP_TEMP_FILES
            value: '1'
          - name: TORCHINDUCTOR_CACHE_DIR
            value: /mnt/lustre/jit-cache/gb200/cu13/v0.33.0/glm52-tp8-dspark5/torchinductor
          - name: TORCH_SYMMMEM
            value: NVSHMEM
          - name: TQDM_DISABLE
            value: '1'
          - name: TRITON_CACHE_DIR
            value: /mnt/lustre/jit-cache/gb200/cu13/v0.33.0/glm52-tp8-dspark5/triton
          - name: TRITON_LIBCUDA_PATH
            value: /usr/lib64
          - name: UCX_MEMTYPE_CACHE
            value: 'n'
          - name: UCX_NET_DEVICES
            value: mlx5_0:1,mlx5_1:1,mlx5_3:1,mlx5_4:1
          - name: VLLM_ALLREDUCE_USE_FLASHINFER
            value: '1'
          - name: VLLM_ALLREDUCE_USE_SYMM_MEM
            value: '0'
          - name: VLLM_CACHE_ROOT
            value: /mnt/lustre/jit-cache/gb200/cu13/v0.33.0/glm52-tp8-dspark5/vllm
          - name: VLLM_ENGINE_READY_TIMEOUT_S
            value: '3600'
          - name: VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS
            value: '1800'
          - name: VLLM_FLASHINFER_ALLREDUCE_BACKEND
            value: auto
          - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
            value: '120'
          - name: VLLM_LOGGING_LEVEL
            value: INFO
          - name: VLLM_NO_USAGE_STATS
            value: '1'
          - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
            value: '1'
          - name: VLLM_USE_NCCL_SYMM_MEM
            value: '0'
          - name: VLLM_USE_RUST_FRONTEND
            value: '1'
          - name: VLLM_USE_V2_MODEL_RUNNER
            value: '1'
          - name: XDG_CACHE_HOME
            value: /mnt/lustre/jit-cache/gb200/cu13/v0.33.0/glm52-tp8-dspark5/xdg
          ports:
          - containerPort: 8000
            name: vllm-0
            protocol: TCP
          readinessProbe:
            exec:
              command:
              - /bin/bash
              - -c
              - if [ "${LWS_WORKER_INDEX:-0}" = "0" ]; then curl -sf http://localhost:8000/v1/models
                | grep -q '"id"'; else pgrep -f 'vllm' > /dev/null; fi
            periodSeconds: 5
            failureThreshold: 120
          resources:
            requests:
              cpu: '32'
              memory: 640Gi
              ephemeral-storage: 256Gi
              nvidia.com/gpu: '4'
            limits:
              memory: 640Gi
              ephemeral-storage: 256Gi
              nvidia.com/gpu: '4'
            claims:
            - name: compute-domain-channel
          volumeMounts:
          - name: dshm
            mountPath: /dev/shm
          - name: shared-storage
            mountPath: /mnt/lustre
          - name: local-nvme
            mountPath: /mnt/local
          workingDir: /code
        - name: dcgm-exporter
          image: nvcr.io/nvidia/k8s/dcgm-exporter:4.5.2-4.8.1-ubuntu22.04
          imagePullPolicy: IfNotPresent
          args:
          - -f
          - /etc/dcgm-exporter/custom-counters.csv
          ports:
          - containerPort: 9400
            name: dcgm
            protocol: TCP
          env:
          - name: NVIDIA_VISIBLE_DEVICES
            value: all
          - name: NVIDIA_DRIVER_CAPABILITIES
            value: utility
          - name: DCGM_EXPORTER_KUBERNETES_GPU_ID_TYPE
            value: uid
          volumeMounts:
          - name: dcgm-metrics
            mountPath: /etc/dcgm-exporter/custom-counters.csv
            subPath: custom-counters.csv
            readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.9.0
          imagePullPolicy: IfNotPresent
          args:
          - --collector.disable-defaults
          - --collector.infiniband
          - --collector.netstat
          - --collector.pressure
          - --collector.schedstat
          - --collector.cpu
          - --path.sysfs=/host/sys
          - --path.procfs=/host/proc
          ports:
          - containerPort: 9100
            name: node-metrics
            protocol: TCP
          volumeMounts:
          - name: sys
            mountPath: /host/sys
            readOnly: true
          - name: proc
            mountPath: /host/proc
            readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: node-role.kubernetes.io/hpc-rack-1
                  operator: Exists
                - key: nvidia.com/gpu.product
                  operator: In
                  values:
                  - NVIDIA-GB200
        tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        resourceClaims:
        - name: compute-domain-channel
          resourceClaimTemplateName: llm-d-dev-claim
---
