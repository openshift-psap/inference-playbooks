apiVersion: v1
kind: ConfigMap
metadata:
  name: glm-5-2-gb200-tp8-dspark5-epp-config
  labels:
    app.kubernetes.io/name: manifesto
    app.kubernetes.io/instance: glm-5-2-gb200-tp8-dspark5
    llm-d.ai/owner: inference-playbooks
    app.kubernetes.io/component: routing
data:
  plugins.yaml: |
    apiVersion: inference.networking.x-k8s.io/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: active-request-scorer
    - type: queue-scorer
    - type: weighted-random-picker
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: active-request-scorer
        weight: 2
      - pluginRef: queue-scorer
        weight: 2
      - pluginRef: weighted-random-picker
---
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: glm-5-2-gb200-tp8-dspark5-infpool
  labels:
    app.kubernetes.io/name: manifesto
    app.kubernetes.io/instance: glm-5-2-gb200-tp8-dspark5
    llm-d.ai/owner: inference-playbooks
    app.kubernetes.io/component: routing
spec:
  targetPorts:
  - number: 8000
  selector:
    matchLabels:
      app.kubernetes.io/instance: glm-5-2-gb200-tp8-dspark5
      llm-d.ai/role: decode
      llm-d.ai/inferenceServing: 'true'
      llm-d.ai/deployment: aggregated
      leaderworkerset.sigs.k8s.io/worker-index: '0'
  endpointPickerRef:
    name: glm-5-2-gb200-tp8-dspark5-infpool-epp
    kind: Service
    port:
      number: 9002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glm-5-2-gb200-tp8-dspark5-infpool-epp
  labels:
    app.kubernetes.io/name: manifesto
    app.kubernetes.io/instance: glm-5-2-gb200-tp8-dspark5
    llm-d.ai/owner: inference-playbooks
    app.kubernetes.io/component: epp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: manifesto
      app.kubernetes.io/instance: glm-5-2-gb200-tp8-dspark5
      llm-d.ai/owner: inference-playbooks
      app.kubernetes.io/component: epp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: manifesto
        app.kubernetes.io/instance: glm-5-2-gb200-tp8-dspark5
        llm-d.ai/owner: inference-playbooks
        app.kubernetes.io/component: epp
        inferencepool: glm-5-2-gb200-tp8-dspark5-infpool-epp
    spec:
      serviceAccountName: glm-5-2-gb200-tp8-dspark5-infpool-epp
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
      containers:
      - name: epp
        image: ghcr.io/llm-d/llm-d-router-endpoint-picker:v0.10.0
        imagePullPolicy: Always
        args:
        - --config-file=/etc/epp/plugins.yaml
        - --grpc-port=9002
        - --metrics-port=9090
        - --metrics-endpoint-auth=false
        - -v=4
        - --pool-name=glm-5-2-gb200-tp8-dspark5-infpool
        - --pool-namespace=vllm
        ports:
        - containerPort: 9002
          name: grpc
        - containerPort: 9090
          name: metrics
        volumeMounts:
        - name: config
          mountPath: /etc/epp/plugins.yaml
          subPath: plugins.yaml
        resources:
          requests:
            cpu: '8'
            memory: 16Gi
          limits:
            cpu: '8'
            memory: 16Gi
      volumes:
      - name: config
        configMap:
          name: glm-5-2-gb200-tp8-dspark5-epp-config
---
