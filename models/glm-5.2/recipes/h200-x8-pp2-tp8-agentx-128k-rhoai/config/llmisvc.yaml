# GLM-5.2-FP8 across 2× 8×H200 nodes: PP=2, TP=8 via LLMInferenceService.
# Uses nvidia.com/gpu for GPU allocation.
#
# For RDMA with composite DRA (GPU + NIC pairs), use
# pp2-tp8-llmisvc-composite-dra.yaml instead.
#
# For Multus secondary networks, add a pod annotation to both
# template and worker specs:
#   metadata:
#     annotations:
#       k8s.v1.cni.cncf.io/networks: <your-net-attach-def>
#
# Prerequisites:
# - LLMInferenceServiceConfig for pipeline-parallel worker must exist
#   (see ../../../prerequisites/pp-worker-llmisvcconfig.yaml)
# - KServe with LLMInferenceService v1alpha2 support
# - LeaderWorkerSet controller installed (kubernetes-sigs/lws)
# - Secret llm-d-hf-token with key HF_TOKEN in the target namespace
# - Model weights pre-loaded to a PVC (~756 GB)
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: glm52-pp
spec:
  model:
    uri: pvc://glm52-fp8-weights
    name: glm-5.2-fp8
  storageInitializer:
    enabled: false
  replicas: 1
  parallelism:
    pipeline: 2
    tensor: 8
  template:
    containers:
      - name: main
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: llm-d-hf-token
                key: HF_TOKEN
          - name: VLLM_ADDITIONAL_ARGS
            value: >-
              --kv-cache-dtype fp8
              --tool-call-parser glm47
              --reasoning-parser glm45
              --enable-auto-tool-choice
              --skip-mm-profiling
              --trust-remote-code
              --distributed-timeout-seconds 3600
          - name: VLLM_ENGINE_READY_TIMEOUT_S
            value: "3600"
          - name: KSERVE_INFER_ROCE
            value: "true"
        resources:
          requests:
            cpu: 32
            memory: 256Gi
            nvidia.com/gpu: "8"
          limits:
            memory: 1024Gi
            nvidia.com/gpu: "8"
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          failureThreshold: 720
          periodSeconds: 10
        volumeMounts:
          - name: dshm
            mountPath: /dev/shm
          - name: models
            mountPath: /mnt/models
    volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
      - name: models
        persistentVolumeClaim:
          claimName: glm52-fp8-weights
  worker:
    containers:
      - name: main
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: llm-d-hf-token
                key: HF_TOKEN
          - name: VLLM_ADDITIONAL_ARGS
            value: >-
              --kv-cache-dtype fp8
              --tool-call-parser glm47
              --reasoning-parser glm45
              --enable-auto-tool-choice
              --skip-mm-profiling
              --trust-remote-code
              --distributed-timeout-seconds 3600
          - name: VLLM_ENGINE_READY_TIMEOUT_S
            value: "3600"
          - name: KSERVE_INFER_ROCE
            value: "true"
        resources:
          requests:
            cpu: 32
            memory: 256Gi
            nvidia.com/gpu: "8"
          limits:
            memory: 1024Gi
            nvidia.com/gpu: "8"
        volumeMounts:
          - name: dshm
            mountPath: /dev/shm
          - name: models
            mountPath: /mnt/models
    volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
      - name: models
        persistentVolumeClaim:
          claimName: glm52-fp8-weights
