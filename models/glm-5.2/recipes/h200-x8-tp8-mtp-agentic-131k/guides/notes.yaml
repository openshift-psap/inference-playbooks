schema_version: 1
profile:
  label: GLM-5.2 single-node TP8/MTP
  headline: Both platforms use a pre-populated model PVC; serving and benchmark behavior remain unvalidated.
  specs:
    - {label: Checkpoint, source: "recipe.yaml#/serving/model"}
    - {label: Parallelism, source: "recipe.yaml#/serving/parallelism"}
    - {label: Node scope, source: "recipe.yaml#/deployment/scope"}
    - {label: Model storage PVC, source: "recipe.yaml#/deployment/storage/pvc"}
decisions:
  - subjects: [single-node, TP8, MTP]
    why: Prefill and decode share one eight-GPU node, with tensor parallelism across its GPUs and MTP speculative decoding.
  - subjects: [RHOAI 3.5.0-GA, single-node support]
    why: LLMInferenceService manages the single-node runtime. This configuration has not been independently runtime- or benchmark-validated.
  - subjects: [custom image, image overlay, engine declaration]
    why: The custom upstream image has an image-bound engine declaration. The image-only overlay supplies its container image field; engine provenance is linked in recipe.yaml serving.engine.source.
  - subjects: [workload profile]
    why: AIPerf AgentX 128K is the target benchmark workload; no committed benchmark runs are referenced.
  - subjects: [hardware profile]
    why: The capability profile describes the required accelerators and interconnect. Verify actual host CPU and memory availability against the resource requests before deployment.
  - subjects: [RHOAI model storage, shared memory, probes, served model alias]
    why: RHOAI mounts a pre-populated PVC read-only at /mnt/models, separately from shared memory. The runtime overlay supplies the API alias and probes. See guides/storage.md for preparation, adaptation and TLS behavior.
  - subjects: [standalone vLLM model storage]
    why: A separate model-ops Job downloads the checkpoint to the same PVC before serving. The Deployment mounts it read-only at /mnt/models and does not need Hugging Face access at runtime. See guides/storage.md.
  - subjects: [maturity, benchmark evidence]
    why: There are no committed benchmark runs for this configuration. Static checks and rendering do not establish serving correctness or performance.
  - subjects: [speculative config encoding]
    why: The RHOAI runtime consumes additional arguments as shell text, so its platform override quotes the JSON payload. The standalone template instead passes raw JSON in a single argv token.
  - subjects: [standalone vLLM, platform overrides]
    why: A Deployment-targeted patch supplies the local model path, read-only PVC mount, API alias, startup budget and shared-memory settings not honored by the current template, removes its unused Hugging Face token dependency, and removes its undeclared CPU limit. See guides/storage.md.
known_issues:
  - issue: The shared PVC must contain the complete checkpoint before serving starts.
    impact: A missing or partial checkpoint prevents the Deployment and RHOAI service from loading the model.
    mitigation: Run the model-ops download Job and wait for it to complete before launching; retain the PVC between runs.
  - issue: Exact checkpoint storage preparation and GLM TP8/MTP runtime validation remain deployment prerequisites.
    impact: Source validation and faithful rendering do not prove PVC population, schedulability, serving correctness or AgentX performance.
    mitigation: Follow guides/storage.md, verify installed controller presets and namespace security, and record separate compliant evidence before any maturity promotion.
quickstart:
  - step: Prepare storage and access
    detail: On Janus, apply models/glm-5.2/model-ops/glm52-weights-janus.yaml, then run models/glm-5.2/model-ops/download-fp8-pvc.yaml with the hf-token Secret present. Wait for Job completion before launching either platform and keep the PVC between runs. Elsewhere, provide an equivalent PVC.
  - step: Adapt and regenerate
    detail: Keep the recipe and both platform PVC references synchronized; then validate, render and check drift. Never edit generated manifests.
  - step: Verify serving and benchmark
    detail: Verify model loading, API and probe behavior, tool calling and MTP before measuring the target workload; source/schema checks alone do not establish these results.
