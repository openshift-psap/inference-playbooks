schema_version: 4
recipe_id: gemma-4-mtp-single-gpu
model_id: gemma-4
platforms:
  - stack: vllm
    version: v0.24.0
    overrides: platforms/vllm-v0.24.0.yaml
hardware_profile: hardware-profiles/nvidia-h200-sxm-8x-nvlink-r1.yaml
workload_profile: guidellm-8k1k
deployment_mode: mtp-single-gpu
optimization_intent: single-GPU serving with MTP
maturity: day-zero

serving:
  image: docker.io/vllm/vllm-openai:v0.24.0
  model: RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic
  served_model_name: RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic
  parallelism:
    mode: tp
    tp: 1
  resources:
    requests:
      cpu: "8"
      memory: 32Gi
    limits:
      cpu: "8"
      memory: 64Gi
  port: 8000
  args:
    - flag: --enable-prefix-caching
      required: true
      why: Reduces TTFT on repeated prefix patterns.
    - flag: --speculative-config
      value: '{"method":"mtp","model":"google/gemma-4-26B-A4B-it-assistant","num_speculative_tokens":3}'
      required: true
      why: Enables MTP speculative decoding with companion draft model.

deployment:
  scope: single-node

notes: guides/notes.yaml
