schema_version: 4
recipe_id: gemma-4-vllm-h200-tp1
model_id: gemma-4
platforms:
  - stack: vllm
    version: v0.24.0
    overrides: platforms/vllm-v0.24.0.yaml
hardware_profile: hardware-profiles/nvidia-h200-sxm-8x-nvlink-r1.yaml
workload_profile: guidellm-8k1k
deployment_mode: tp1
optimization_intent: throughput
maturity: day-zero

serving:
  image: docker.io/vllm/vllm-openai:v0.24.0
  image_usage:
    kind: default
    variant: cuda
  engine:
    name: vllm
    image: docker.io/vllm/vllm-openai:v0.24.0
    version: 0.24.0
    source: https://github.com/vllm-project/vllm/releases/tag/v0.24.0
  model: RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic
  served_model_name: RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic
  parallelism:
    mode: tp
    tp: 1
  resources:
    requests:
      cpu: "8"
      memory: 32Gi
    limits:
      cpu: "8"
      memory: 64Gi
  port: 8000
  args:
    - flag: --kv-cache-dtype
      value: fp8
      required: true
      why: FP8 KV cache doubles effective capacity; matches recipes.vllm.ai reference.
    - flag: --limit-mm-per-prompt
      value: '{"image":0,"video":0}'
      required: true
      why: This is a text-only workload; disable image and video inputs.
    - flag: --skip-mm-profiling
      required: true
      why: This is a text-only workload; skip multimodal profiling.
    - flag: --enable-auto-tool-choice
      required: true
      why: Enables model-driven tool selection in chat completions.
    - flag: --tool-call-parser
      value: gemma4
      required: true
      why: Required for structured tool-call parsing with Gemma 4.
    - flag: --reasoning-parser
      value: gemma4
      required: true
      why: Separates thinking tokens from response content.

deployment:
  scope: single-node

notes: guides/notes.yaml
