schema_version: 3
recipe_id: gemma-4-vllm-h200-tp1
model_id: gemma-4
platform: {stack: vllm, version: "v0.24.0"}
hardware_profile: hardware-profiles/nvidia-h200-sxm-8x-nvlink-r1.yaml
workload_profile: guidellm-8k1k
deployment_mode: tp1
optimization_intent: throughput
maturity: day-zero

deployment:
  scope: single-node
  status:
    state: needs-verification
    note: Forge profile1 is 1K/1K and does not validate the 8K/1K workload; this Forge recipe also omits MTP.
  model_cache:
    volume_name: model
    model_directory_name: Gemma-4-26B-A4B-it-FP8-dynamic
    pvc_size: "100Gi"
  parallelism: {tensor: 1, pipeline: 1, data: 1}
  manifests:
    - {path: manifests/lws.yaml, kind: LeaderWorkerSet}
    - {path: manifests/service.yaml, kind: Service}
  components:
    modelserver:
      kind: LeaderWorkerSet
      source: manifests/lws.yaml
      leader:
        containers:
          vllm:
            arg_choices:
              - {flag: --tensor-parallel-size, value: 1, required: true, why: The Forge smoke uses one H200 GPU.}
              - {flag: --max-model-len, value: 16384, required: true, why: Supports the declared 8K input and 1K output workload.}
              - {flag: --enable-prefix-caching, required: true, why: Matches the existing Gemma deployment.}
  auxiliary_sources:
    - {path: manifests/service.yaml, kind: Service}
notes: guides/notes.yaml
